server {
    listen 80;

    # Tudo que não é /api/ vai para o proxy padrão
    location / {
        proxy_pass http://205.209.122.248:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tudo que começa com /api/ vai para outra porta (7214)
    location /api/ {
        proxy_pass http://205.209.122.248:7214;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
