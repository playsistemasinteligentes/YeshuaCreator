upstream front_pool {
    least_conn;
    server front:8080;
}

upstream api_pool {
    least_conn;
    server api:7214;
}

server {
    listen 80;

    # =========================
    # API (Docker)
    # =========================
    location /yapi/ {
        proxy_pass http://api_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }

    # =========================
    # FRONT (load balanced)
    # =========================
    location / {
        proxy_pass http://front_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}



server {
    listen 443 ssl;
    server_name playsis.com.br;

    ssl_certificate /etc/letsencrypt/live/playsis.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playsis.com.br/privkey.pem;

    location /yapi/ {
        proxy_pass http://api_pool/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://front_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
