services:
  front:
    build:
      context: ../../..
      dockerfile: Devops/infra/docker/front/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
      SA__PASSWORD: "123qwe!@#QWE"
      MYCONFIG__READCONECTIONSTRING: "Server=sqlserver,1433;Database=CLINICA;User Id=sa;Password=123qwe!@#QWE;TrustServerCertificate=True;"
      MYCONFIG__WRITECONECTIONSTRING: "Server=sqlserver,1433;Database=CLINICA;User Id=sa;Password=123qwe!@#QWE;TrustServerCertificate=True;"
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - yeshua-net

  api:
    build:
      context: ../../..
      dockerfile: Devops/infra/docker/api/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:7214"
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=CLINICA;User Id=sa;Password=123qwe!@#QWE;TrustServerCertificate=True;"
      Redis__Host: redis
      SA__PASSWORD: "123qwe!@#QWE"
      MYCONFIG__READCONECTIONSTRING: "Server=sqlserver,1433;Database=CLINICA;User Id=sa;Password=123qwe!@#QWE;TrustServerCertificate=True;"
      MYCONFIG__WRITECONECTIONSTRING: "Server=sqlserver,1433;Database=CLINICA;User Id=sa;Password=123qwe!@#QWE;TrustServerCertificate=True;"
    expose:
      - "7214"
    depends_on:
      - sqlserver
      - redis
    restart: unless-stopped
    networks:
      - yeshua-net

  migration:
    build:
      context: ../../..
      dockerfile: Devops/infra/docker/migration/Dockerfile
    environment:
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=CLINICA;User Id=sa;Password=123qwe!@#QWE;TrustServerCertificate=True;"
      SA__PASSWORD: "123qwe!@#QWE"
      MYCONFIG__READCONECTIONSTRING: "Server=sqlserver,1433;Database=CLINICA;User Id=sa;Password=123qwe!@#QWE;TrustServerCertificate=True;"
      MYCONFIG__WRITECONECTIONSTRING: "Server=sqlserver,1433;Database=CLINICA;User Id=sa;Password=123qwe!@#QWE;TrustServerCertificate=True;"
    depends_on:
      - sqlserver
    networks:
      - yeshua-net
    restart: "no"

  nginx:
    container_name: yeshua-nginx
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - front
      - api
    restart: unless-stopped
    networks:
      - yeshua-net

  redis:
    image: redis:7-alpine
    container_name: yeshua-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - yeshua-net

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: yeshua-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      SA_PASSWORD: "123qwe!@#QWE"
    ports:
      - "1433:1433"
    volumes:
      - /root/YeshuaDB/persistent/sql:/var/opt/mssql
    restart: unless-stopped
    networks:
      - yeshua-net




  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: yeshua-rabbitmq
    ports:
      - "5672:5672"     # Porta AMQP para comunicação com workers e API
      - "15672:15672"   # Porta da interface de gerenciamento web
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - yeshua-net
    restart: unless-stopped


networks:
  yeshua-net:
    driver: bridge
