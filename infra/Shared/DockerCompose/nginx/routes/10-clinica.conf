# <operational-spec>
# standard: OPERATIONAL_SUPPORT_ADOPTION_STANDARD
# gates: G2,G7
# depths: D0
# severities: notApplicable
# modes: Live
# dataClassification: SafeMetadata
# identities: Application,Environment,Version
# technicalOutcomes: notApplicable
# businessOutcomes: notApplicable
# evidence: WorkerHealthRoute
# </operational-spec>

location /yapi/ {
    proxy_pass http://clinica_api_pool;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /yworker/ {
    proxy_pass http://clinica_worker_pool;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /yworker/health/live {
    proxy_pass http://clinica_worker_pool/yapi/health/live;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /yworker/health/ready {
    proxy_pass http://clinica_worker_pool/yapi/health/ready;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    proxy_pass http://clinica_front_pool;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
