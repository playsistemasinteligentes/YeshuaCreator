# <operational-spec>
# standard: OPERATIONAL_SUPPORT_ADOPTION_STANDARD
# gates: G2,G7
# depths: D0
# severities: notApplicable
# modes: Live
# dataClassification: SafeMetadata
# identities: Application,Environment,Version
# technicalOutcomes: notApplicable
# businessOutcomes: notApplicable
# evidence: MultiApplicationGatewayRoutes
# </operational-spec>

location = /apps/central/yapi {
    return 301 /apps/central/yapi/;
}

location /apps/central/yapi/ {
    rewrite ^/apps/central/yapi/(.*)$ /yapi/$1 break;
    proxy_pass http://central_api_pool;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /apps/central/yapi;
}

location = /apps/central/yworker/health/live {
    proxy_pass http://central_worker_pool/yapi/health/live;
