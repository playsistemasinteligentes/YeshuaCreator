# pendencia: proteger a API operacional com autenticacao e autorizacao.
location = /operational {
    return 301 /operational/;
}

location /operational/ {
    proxy_pass http://operational_intelligence_api_pool/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /operational;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_set_header Connection "";
    proxy_redirect / /operational/;
}
