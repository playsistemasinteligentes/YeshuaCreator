server {
    # Self-contained agent JWTs can exceed the default 8 KiB header line.
    # The API independently enforces its 32 KiB total header budget.
    large_client_header_buffers 4 32k;
    listen 80;
    # Fallback while HTTPS has not been configured with a valid certificate.
    server_name _;

    include /etc/nginx/routes/*.conf;
}
