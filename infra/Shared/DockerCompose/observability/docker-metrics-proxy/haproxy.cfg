global
    log stdout format raw local0
    maxconn 64

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend docker_metrics
    bind :2375

    acl allowed_method method GET HEAD
    acl allowed_path path,url_dec -m reg -i ^(/v[0-9.]+)?/(_ping|version|containers/json|containers/[^/]+/(json|stats))$

    http-request deny deny_status 403 unless allowed_method
    http-request deny deny_status 403 unless allowed_path

    default_backend docker_socket

backend docker_socket
    server docker /var/run/docker.sock
