groups:
  - name: yeshua-operational
    interval: 30s
    rules:
      - alert: YeshuaOperationalErrorRateHigh
        expr: |
          sum by (service_name, deployment_environment_name) (
            rate({__name__=~"yeshua_operation_executions(_execution)?(_total)?", outcome=~"failed|timed_out|unavailable"}[5m])
          )
          /
          clamp_min(
            sum by (service_name, deployment_environment_name) (
              rate({__name__=~"yeshua_operation_executions(_execution)?(_total)?"}[5m])
            ),
            0.000001
          ) > 0.05
        for: 10m
        labels:
          severity: warning
          yeshua_scope: application
        annotations:
          summary: "Taxa de falha tecnica acima de 5%"
          description: "O servico {{ $labels.service_name }} permaneceu acima do limite fixo inicial por 10 minutos."
          runbook: "docs/operational/runbooks/OBSERVABILITY_ALERT_RUNBOOKS.md#yeshuaoperationalerrorratehigh"

      - alert: YeshuaWorkerFailureDetected
        expr: |
          sum by (service_name, operation, deployment_environment_name) (
            increase({__name__=~"yeshua_worker_items(_item)?(_total)?", state="failed"}[5m])
          ) > 0
        for: 1m
        labels:
          severity: warning
          yeshua_scope: worker
        annotations:
          summary: "Worker registrou item com falha"
          description: "O Worker {{ $labels.operation }} registrou falha nos ultimos cinco minutos."
          runbook: "docs/operational/runbooks/OBSERVABILITY_ALERT_RUNBOOKS.md#yeshuaworkerfailuredetected"

      - alert: YeshuaWorkerBatchPressureHigh
        expr: |
          sum by (service_name, operation, deployment_environment_name) (
            rate({__name__=~"yeshua_worker_saturated_cycles(_cycle)?(_total)?"}[15m])
          )
          /
          clamp_min(
            sum by (service_name, operation, deployment_environment_name) (
              rate({__name__=~"yeshua_worker_cycles(_cycle)?(_total)?"}[15m])
            ),
            0.000001
          ) > 0.80
        for: 15m
        labels:
          severity: warning
          yeshua_scope: worker
        annotations:
          summary: "Worker opera continuamente no limite do lote"
          description: "Mais de 80% dos ciclos de {{ $labels.operation }} atingiram o limite do lote. Isso indica pressao de backlog, nao prova a contagem global da fila."
          runbook: "docs/operational/runbooks/OBSERVABILITY_ALERT_RUNBOOKS.md#yeshuaworkerbatchpressurehigh"

      - alert: YeshuaWorkerLoopStale
        expr: |
          time() - max by (service_name, operation, deployment_environment_name) (
            {__name__=~"yeshua_worker_current(_item)?", state="last_heartbeat_unix_seconds"}
          ) > 120
        for: 2m
        labels:
          severity: critical
          yeshua_scope: worker
        annotations:
          summary: "Laco do Worker sem progresso observavel"
          description: "Nenhuma instancia ativa do Worker {{ $labels.operation }} atualiza seu estado ha mais de dois minutos. A indisponibilidade de uma replica isolada e tratada pela saude do container."
          runbook: "docs/operational/runbooks/OBSERVABILITY_ALERT_RUNBOOKS.md#yeshuaworkerloopstale"

      - alert: YeshuaWorkerCycleStuck
        expr: |
          max by (service_name, service_instance_id, operation, deployment_environment_name) (
            {__name__=~"yeshua_worker_current(_item)?", state="cycle_in_progress"}
          ) == 1
          and on (service_name, service_instance_id, operation, deployment_environment_name)
          (
            time() - max by (service_name, service_instance_id, operation, deployment_environment_name) (
              {__name__=~"yeshua_worker_current(_item)?", state="last_cycle_started_unix_seconds"}
            ) > 300
          )
        for: 1m
        labels:
          severity: critical
          yeshua_scope: worker
        annotations:
          summary: "Ciclo de Worker possivelmente travado"
          description: "O ciclo de {{ $labels.operation }} permanece em andamento ha mais de cinco minutos."
          runbook: "docs/operational/runbooks/OBSERVABILITY_ALERT_RUNBOOKS.md#yeshuaworkercyclestuck"

      - alert: YeshuaQueueBlocked
        expr: |
          (
            max by (service_name, operation, queue, deployment_environment_name) (
              {__name__=~"yeshua_queue_current(_value)?", metric="eligible_backlog"}
            ) > 0
            and on (service_name, operation, deployment_environment_name)
            (
              time() - max by (service_name, operation, deployment_environment_name) (
                {__name__=~"yeshua_worker_current(_item)?", state="last_heartbeat_unix_seconds"}
              ) < 120
            )
            and on (service_name, operation, deployment_environment_name)
            (
              time() - max by (service_name, operation, deployment_environment_name) (
                {__name__=~"yeshua_queue_current(_value)?", metric="sampled_at_unix_seconds"}
              ) < 120
            )
          )
          unless on (service_name, operation, deployment_environment_name)
          (
            sum by (service_name, operation, deployment_environment_name) (
              rate({__name__=~"yeshua_worker_items(_item)?(_total)?", state="processed"}[5m])
            ) > 0
          )
        for: 5m
        labels:
          severity: critical
          yeshua_scope: queue
        annotations:
          summary: "Fila possui itens elegiveis sem vazao"
          description: "A fila {{ $labels.queue }} possui backlog elegivel, mas nenhum Worker concluiu itens nos ultimos cinco minutos."
          runbook: "docs/operational/runbooks/OBSERVABILITY_ALERT_RUNBOOKS.md#yeshuaqueueblocked"

      - alert: YeshuaQueueWorkersUnavailable
        expr: |
          (
            max by (service_name, operation, queue, deployment_environment_name) (
              last_over_time(
                {__name__=~"yeshua_queue_current(_value)?", metric="eligible_backlog"}[15m]
              )
            ) > 0
          )
          unless on (service_name, operation, deployment_environment_name)
          (
            time() - max by (service_name, operation, deployment_environment_name) (
              last_over_time(
                {__name__=~"yeshua_worker_current(_item)?", state="last_heartbeat_unix_seconds"}[15m]
              )
            ) < 120
          )
        for: 2m
        labels:
          severity: critical
          yeshua_scope: queue
        annotations:
          summary: "Fila possui backlog sem Worker disponivel"
          description: "A fila {{ $labels.queue }} possui itens elegiveis, mas nenhuma instancia do Worker atualiza heartbeat."
          runbook: "docs/operational/runbooks/OBSERVABILITY_ALERT_RUNBOOKS.md#yeshuaqueueworkersunavailable"

      - alert: YeshuaQueueOldestItemHigh
        expr: |
          (
            max by (service_name, operation, queue, deployment_environment_name) (
              {__name__=~"yeshua_queue_current(_value)?", metric="oldest_eligible_age_seconds"}
            ) > 900
            and on (service_name, operation, deployment_environment_name)
            (
              time() - max by (service_name, operation, deployment_environment_name) (
                {__name__=~"yeshua_queue_current(_value)?", metric="sampled_at_unix_seconds"}
              ) < 120
            )
            and on (service_name, operation, deployment_environment_name)
            (
              sum by (service_name, operation, deployment_environment_name) (
                rate({__name__=~"yeshua_worker_items(_item)?(_total)?", state="processed"}[5m])
              ) > 0
            )
          )
        for: 5m
        labels:
          severity: warning
          yeshua_scope: queue
        annotations:
          summary: "Item elegivel permanece antigo na fila"
          description: "O item elegivel mais antigo de {{ $labels.queue }} ultrapassou quinze minutos. O limite e inicial e deve evoluir com a linha de base."
          runbook: "docs/operational/runbooks/OBSERVABILITY_ALERT_RUNBOOKS.md#yeshuaqueueoldestitemhigh"

      - alert: YeshuaQueueItemCritical
        expr: |
          max by (service_name, operation, queue, metric, deployment_environment_name) (
            {__name__=~"yeshua_queue_current(_value)?", metric=~"sick_item_(stale_processing|terminal_failure)"}
          ) > 0
        for: 2m
        labels:
          severity: critical
          yeshua_scope: queue_item
        annotations:
          summary: "Fila possui item em estado critico"
          description: "A fila {{ $labels.queue }} possui item classificado como {{ $labels.metric }}. Consulte os piores itens pelo diagnostico limitado e correlacione a identidade com o Tempo e o Loki."
          runbook: "docs/operational/runbooks/OBSERVABILITY_ALERT_RUNBOOKS.md#yeshuaqueueitemcritical"

      - alert: YeshuaQueueItemDegraded
        expr: |
          max by (service_name, operation, queue, metric, deployment_environment_name) (
            {__name__=~"yeshua_queue_current(_value)?", metric=~"sick_item_(excessive_wait|recurrent_execution|repeated_failure)"}
          ) > 0
        for: 5m
        labels:
          severity: warning
          yeshua_scope: queue_item
        annotations:
          summary: "Fila possui item individual degradado"
          description: "A fila {{ $labels.queue }} possui item classificado como {{ $labels.metric }}. A fila pode continuar saudavel enquanto o item exige investigacao."
          runbook: "docs/operational/runbooks/OBSERVABILITY_ALERT_RUNBOOKS.md#yeshuaqueueitemdegraded"

      - alert: YeshuaQueueHealthSnapshotStale
        expr: |
          time() - max by (service_name, operation, queue, deployment_environment_name) (
            last_over_time(
              {__name__=~"yeshua_queue_current(_value)?", metric="sampled_at_unix_seconds"}[15m]
            )
          ) > 120
        for: 2m
        labels:
          severity: warning
          yeshua_scope: queue
        annotations:
          summary: "Snapshot de saude da fila ficou desatualizado"
          description: "A fila {{ $labels.queue }} nao publica um snapshot diagnostico recente. O estado da fila e desconhecido."
          runbook: "docs/operational/runbooks/OBSERVABILITY_ALERT_RUNBOOKS.md#yeshuaqueuehealthsnapshotstale"

      - alert: YeshuaQueueHealthProbeFailed
        expr: |
          max by (service_name, operation, queue, deployment_environment_name) (
            {__name__=~"yeshua_queue_current(_value)?", metric="sample_failed"}
          ) > 0
        for: 2m
        labels:
          severity: warning
          yeshua_scope: queue
        annotations:
          summary: "Diagnostico da fila nao conseguiu consultar o repositorio"
          description: "A coleta de saude da fila {{ $labels.queue }} falha ha pelo menos dois minutos."
          runbook: "docs/operational/runbooks/OBSERVABILITY_ALERT_RUNBOOKS.md#yeshuaqueuehealthprobefailed"

      - alert: YeshuaTelemetryExporterFailure
        expr: |
          sum by (exporter) (
            increase({__name__=~"otelcol_exporter_send_failed_(metric_points|spans|log_records).*"}[5m])
          ) > 0
        for: 2m
        labels:
          severity: critical
          yeshua_scope: telemetry
        annotations:
          summary: "Collector nao consegue exportar telemetria"
          description: "O exporter {{ $labels.exporter }} descartou ou deixou de enviar sinais."
          runbook: "docs/operational/runbooks/OBSERVABILITY_ALERT_RUNBOOKS.md#yeshuatelemetryexporterfailure"

      - alert: YeshuaContainerUnhealthy
        expr: |
          sum by (container_name) (
            {__name__=~"container_state_health_status.*", container_state_health_state="unhealthy"}
          ) > 0
        for: 2m
        labels:
          severity: critical
          yeshua_scope: container
        annotations:
          summary: "Container marcado como unhealthy"
          description: "O healthcheck do container {{ $labels.container_name }} permaneceu unhealthy por dois minutos."
          runbook: "docs/operational/runbooks/OBSERVABILITY_ALERT_RUNBOOKS.md#yeshuacontainerunhealthy"

      - alert: YeshuaContainerRestartLoop
        expr: |
          sum by (container_name) (
            increase({__name__=~"container_restarts.*"}[30m])
          ) > 3
        for: 1m
        labels:
          severity: warning
          yeshua_scope: container
        annotations:
          summary: "Container reiniciou repetidamente"
          description: "O container {{ $labels.container_name }} reiniciou mais de tres vezes em trinta minutos."
          runbook: "docs/operational/runbooks/OBSERVABILITY_ALERT_RUNBOOKS.md#yeshuacontainerrestartloop"

      - alert: YeshuaHostCpuSaturated
        expr: |
          100 * avg without (cpu) (
            sum without (state) ({__name__=~"system_cpu_utilization(_ratio)?", state!="idle"})
          ) > 90
        for: 15m
        labels:
          severity: warning
          yeshua_scope: host
        annotations:
          summary: "CPU do servidor acima de 90%"
          description: "A CPU permaneceu saturada por 15 minutos. Correlacione com vazao, latencia e filas antes de recomendar hardware."
          runbook: "docs/operational/runbooks/OBSERVABILITY_ALERT_RUNBOOKS.md#yeshuahostcpusaturated"

      - alert: YeshuaHostMemorySaturated
        expr: |
          100 * sum({__name__=~"system_memory_usage(_bytes)?", state="used"})
          /
          clamp_min(sum({__name__=~"system_memory_usage(_bytes)?"}), 1) > 90
        for: 15m
        labels:
          severity: warning
          yeshua_scope: host
        annotations:
          summary: "Memoria do servidor acima de 90%"
          description: "A memoria usada permaneceu acima do limite fixo inicial por 15 minutos."
          runbook: "docs/operational/runbooks/OBSERVABILITY_ALERT_RUNBOOKS.md#yeshuahostmemorysaturated"

      - alert: YeshuaHostDiskAlmostFull
        expr: |
          100 * sum by (device, mountpoint) ({__name__=~"system_filesystem_usage(_bytes)?", state="used"})
          /
          clamp_min(
            sum by (device, mountpoint) ({__name__=~"system_filesystem_usage(_bytes)?"}),
            1
          ) > 90
        for: 15m
        labels:
          severity: critical
          yeshua_scope: host
        annotations:
          summary: "Filesystem acima de 90%"
          description: "O filesystem {{ $labels.mountpoint }} esta proximo da capacidade."
          runbook: "docs/operational/runbooks/OBSERVABILITY_ALERT_RUNBOOKS.md#yeshuahostdiskalmostfull"
