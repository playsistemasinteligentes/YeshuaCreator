receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://*
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: "opentelemetry-collector"
          scrape_interval: 15s
          static_configs:
            - targets: ["127.0.0.1:8888"]
  hostmetrics:
    root_path: /hostfs
    collection_interval: 15s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      load:
      memory:
      disk:
      filesystem:
      network:
      paging:
      processes:
  docker_stats:
    endpoint: http://docker-metrics-proxy:2375
    collection_interval: 15s
    timeout: 5s
    metrics:
      container.restarts:
        enabled: true
      container.state.health.status:
        enabled: true
      container.state.status:
        enabled: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/ready"

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 26
  batch:
    timeout: 2s
    send_batch_size: 512
    send_batch_max_size: 1024
  resourcedetection/system:
    detectors: [system]
    override: false
    system:
      hostname_sources: [os]

exporters:
  otlp_http/metrics:
    endpoint: http://127.0.0.1:9090/api/v1/otlp
    tls:
      insecure: true
  otlp_http/traces:
    endpoint: http://127.0.0.1:4418
    tls:
      insecure: true
  otlp_http/logs:
    endpoint: http://127.0.0.1:3100/otlp
    tls:
      insecure: true
  otlp_grpc/profiles:
    endpoint: http://127.0.0.1:4040
    tls:
      insecure: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/traces]
    metrics:
      receivers: [otlp, prometheus/collector, hostmetrics, docker_stats]
      processors: [memory_limiter, resourcedetection/system, batch]
      exporters: [otlp_http/metrics]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/logs]
    profiles:
      receivers: [otlp]
      exporters: [otlp_grpc/profiles]
