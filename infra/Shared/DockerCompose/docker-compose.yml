name: playsis-shared

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: yeshua-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      SA_PASSWORD: "123qwe!@#QWE"
    ports:
      - "1433:1433"
    volumes:
      - /root/YeshuaDB/persistent/sql:/var/opt/mssql
    restart: unless-stopped
    networks:
      - yeshua-net

  redis:
    image: redis:7-alpine
    container_name: yeshua-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - yeshua-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: yeshua-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: yeshua
      RABBITMQ_DEFAULT_PASS: yeshua123
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    networks:
      - yeshua-net

  operational-intelligence-api:
    build:
      context: ../../..
      dockerfile: infra/Shared/DockerCompose/operational-intelligence-api/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:5728"
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__OperationalIntelligence: "Server=sqlserver,1433;Database=${YESHUA_DB_OPERATIONAL_INTELLIGENCE:-YESHUA_OPERATIONAL_INTELLIGENCE};User Id=sa;Password=123qwe!@#QWE;Encrypt=False;TrustServerCertificate=True;"
      Mcp__LokiBaseUrl: "http://yeshua-telemetry:3100"
      Mcp__TempoBaseUrl: "http://yeshua-telemetry:3200"
      Mcp__PrometheusBaseUrl: "http://yeshua-telemetry:9090"
      Mcp__DatabaseQuery__Connections__OperationalIntelligence: "Server=sqlserver,1433;Database=${YESHUA_DB_OPERATIONAL_INTELLIGENCE:-YESHUA_OPERATIONAL_INTELLIGENCE};User Id=sa;Password=123qwe!@#QWE;Encrypt=False;TrustServerCertificate=True;"
      Mcp__DatabaseQuery__Connections__Central: "Server=sqlserver,1433;Database=${YESHUA_DB_CENTRAL:-YESHUA_CENTRAL};User Id=sa;Password=123qwe!@#QWE;Encrypt=False;TrustServerCertificate=True;"
      Mcp__DatabaseQuery__Connections__Clinica: "Server=sqlserver,1433;Database=${YESHUA_DB_CLINICA:-YESHUA_CLINICA};User Id=sa;Password=123qwe!@#QWE;Encrypt=False;TrustServerCertificate=True;"
      Mcp__DatabaseQuery__Connections__ApsAdm: "Server=sqlserver,1433;Database=${YESHUA_DB_APS_ADM:-YESHUA_APS_ADM};User Id=sa;Password=123qwe!@#QWE;Encrypt=False;TrustServerCertificate=True;"
      Mcp__DatabaseQuery__Connections__Fiscal: "Server=sqlserver,1433;Database=${YESHUA_DB_FISCAL:-YESHUA_FISCAL};User Id=sa;Password=123qwe!@#QWE;Encrypt=False;TrustServerCertificate=True;"
    ports:
      - "127.0.0.1:5728:5728"
    restart: unless-stopped
    networks:
      - yeshua-net

  yeshua-telemetry:
    image: grafana/otel-lgtm:${YESHUA_TELEMETRY_IMAGE_TAG:-latest}
    container_name: yeshua-telemetry
    mem_limit: "${YESHUA_TELEMETRY_MEMORY_LIMIT:-1536m}"
    cpus: "${YESHUA_TELEMETRY_CPUS:-0.75}"
    environment:
      GF_SECURITY_ADMIN_USER: "${YESHUA_TELEMETRY_GRAFANA_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${YESHUA_TELEMETRY_GRAFANA_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/telemetry/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      ENABLE_LOGS_TEMPO: "${YESHUA_TELEMETRY_ENABLE_LOGS_TEMPO:-true}"
      LGTM_SHUTDOWN_TIMEOUT_SECONDS: "15"
      PROMETHEUS_EXTRA_ARGS: "--storage.tsdb.retention.time=5d --storage.tsdb.retention.size=${YESHUA_TELEMETRY_PROMETHEUS_RETENTION_SIZE:-2GB}"
    ports:
      - "127.0.0.1:${YESHUA_TELEMETRY_GRAFANA_PORT:-3000}:3000"
      - "127.0.0.1:${YESHUA_TELEMETRY_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${YESHUA_TELEMETRY_OTLP_HTTP_PORT:-4318}:4318"
    expose:
      - "3100"
      - "3200"
      - "9090"
    volumes:
      - ./telemetry/otelcol-config.yaml:/otel-lgtm/otelcol-config.yaml:ro
      - ./telemetry/loki-config.yaml:/otel-lgtm/loki-config.yaml:ro
      - ./telemetry/tempo-config.yaml:/otel-lgtm/tempo-config.yaml:ro
      - ./telemetry/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - /root/YeshuaDB/persistent/telemetry:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - yeshua-net

  nginx:
    image: nginx:1.27-alpine
    container_name: yeshua-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/routes:/etc/nginx/routes:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /root/YeshuaStorage:/storage:ro
    restart: unless-stopped
    networks:
      - yeshua-net

networks:
  yeshua-net:
    name: yeshua-net
