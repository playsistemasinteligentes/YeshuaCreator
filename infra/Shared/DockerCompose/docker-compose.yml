name: playsis-shared

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: yeshua-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      SA_PASSWORD: "${YESHUA_SQL_SA_PASSWORD:?Configure credentials.json}"
    ports:
      - "1433:1433"
    volumes:
      - /root/YeshuaDB/persistent/sql:/var/opt/mssql
    restart: unless-stopped
    networks:
      - yeshua-net

  redis:
    image: redis:7-alpine
    container_name: yeshua-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - yeshua-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: yeshua-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${YESHUA_RABBITMQ_USERNAME:?Configure credentials.json}"
      RABBITMQ_DEFAULT_PASS: "${YESHUA_RABBITMQ_PASSWORD:?Configure credentials.json}"
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    networks:
      - yeshua-net

  operational-intelligence:
    build:
      context: ../../..
      dockerfile: infra/Shared/DockerCompose/operational-intelligence/Dockerfile
    container_name: yeshua-operational-intelligence
    init: true
    stop_grace_period: 45s
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:5728;http://127.0.0.1:5729"
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__OperationalIntelligence: "${YESHUA_SQL_OPERATIONAL_INTELLIGENCE:?Configure credentials.json}"
      Mcp__LokiBaseUrl: "http://yeshua-observability:3100"
      Mcp__TempoBaseUrl: "http://yeshua-observability:3200"
      Mcp__PrometheusBaseUrl: "http://yeshua-observability:9090"
      Mcp__DatabaseQuery__Connections__OperationalIntelligence: "${YESHUA_SQL_MCP_OPERATIONAL_INTELLIGENCE:?Configure credentials.json}"
      Mcp__DatabaseQuery__Connections__Central: "${YESHUA_SQL_MCP_CENTRAL:?Configure credentials.json}"
      Mcp__DatabaseQuery__Connections__Clinica: "${YESHUA_SQL_MCP_CLINICA:?Configure credentials.json}"
      Mcp__DatabaseQuery__Connections__ApsAdm: "${YESHUA_SQL_MCP_APS_ADM:?Configure credentials.json}"
      Mcp__DatabaseQuery__Connections__Fiscal: "${YESHUA_SQL_MCP_FISCAL:?Configure credentials.json}"
      Mcp__DatabaseQuery__Connections__Memorias: "${YESHUA_SQL_MCP_MEMORIAS:?Configure credentials.json}"
      Mcp__PrivatePort: "5729"
      McpTunnel__Id: "${YESHUA_MCP_TUNNEL_ID:-}"
      McpTunnel__ApiKey: "${YESHUA_MCP_TUNNEL_API_KEY:-}"
      OPERATIONAL_INTELLIGENCE_BASE_URL: "http://127.0.0.1:5728"
      OPERATIONAL_INTELLIGENCE_MCP_URL: "http://127.0.0.1:5729/mcp"
      YESHUA_AGENT_SOURCE: "/server/YeshuaCreator"
      YESHUA_AGENT_WORKSPACE: "/workspace/YeshuaCreator"
      YESHUA_AGENT_SYNC_ON_START: "${YESHUA_AGENT_SYNC_ON_START:-auto}"
      YESHUA_AGENT_MODE: "${YESHUA_AGENT_MODE:-observe}"
      AgentTasks__Enabled: "${YESHUA_AGENT_TASKS_ENABLED:-true}"
      AgentTasks__WorkspacePath: "/workspace/YeshuaCreator"
      AgentTasks__RuntimeScript: "/app/agent/codex-task.mjs"
      AgentTasks__AllowWorkspaceWrite: "${YESHUA_AGENT_ALLOW_WORKSPACE_WRITE:-false}"
      AgentTasks__ChatGptAuthentication: "${YESHUA_AGENT_CHATGPT_AUTHENTICATION:-true}"
      AgentTasks__CodexHomePath: "/home/agent/.codex"
      CLINICA_CODEX_EXECUTOR_ENABLED: "${CLINICA_CODEX_EXECUTOR_ENABLED:-false}"
      CLINICA_CODEX_BIN: "/home/agent/.npm-global/bin/codex"
      CLINICA_CODEX_MODEL: "${CLINICA_CODEX_MODEL:-}"
      CLINICA_CODEX_TIMEOUT_SECONDS: "${CLINICA_CODEX_TIMEOUT_SECONDS:-900}"
      CLINICA_EXECUTOR_QUEUES: "text.summarize.outbox"
      YESHUA_PROCESSING_SCOPE: "${CLINICA_PROCESSING_SCOPE:-production}"
      CELERY_BROKER_URL: "${YESHUA_CELERY_BROKER_URL:?Configure credentials.json}"
      STORAGE_ROOT: "/clinica-work"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    ports:
      - "127.0.0.1:5728:5728"
    volumes:
      - /root/YeshuaCreator:/server/YeshuaCreator:ro
      - /root/YeshuaStorage:/storage:ro
      - /root/YeshuaStorage/volatile/ia/transcriptions/output:/clinica-work/volatile/ia/transcriptions/output
      - operational-agent-workspace:/workspace
      - operational-agent-codex:/home/agent/.codex
      - operational-agent-claude:/home/agent/.claude
    depends_on:
      - sqlserver
      - yeshua-observability
    restart: unless-stopped
    networks:
      yeshua-net:
        aliases:
          - operational-intelligence-api

  yeshua-observability:
    image: grafana/otel-lgtm:${YESHUA_TELEMETRY_IMAGE_TAG:-latest}
    container_name: yeshua-observability
    mem_limit: "${YESHUA_TELEMETRY_MEMORY_LIMIT:-1536m}"
    cpus: "${YESHUA_TELEMETRY_CPUS:-0.75}"
    environment:
      GF_SECURITY_ADMIN_USER: "${YESHUA_TELEMETRY_GRAFANA_USER:?Configure credentials.json}"
      GF_SECURITY_ADMIN_PASSWORD: "${YESHUA_TELEMETRY_GRAFANA_PASSWORD:?Configure credentials.json}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/observability/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      ENABLE_LOGS_TEMPO: "${YESHUA_TELEMETRY_ENABLE_LOGS_TEMPO:-true}"
      LGTM_SHUTDOWN_TIMEOUT_SECONDS: "15"
      PROMETHEUS_EXTRA_ARGS: "--storage.tsdb.retention.time=5d --storage.tsdb.retention.size=${YESHUA_TELEMETRY_PROMETHEUS_RETENTION_SIZE:-2GB}"
    ports:
      - "127.0.0.1:${YESHUA_TELEMETRY_GRAFANA_PORT:-3000}:3000"
      - "127.0.0.1:${YESHUA_TELEMETRY_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${YESHUA_TELEMETRY_OTLP_HTTP_PORT:-4318}:4318"
    expose:
      - "3100"
      - "3200"
      - "9090"
    volumes:
      - ./observability/otelcol-config.yaml:/otel-lgtm/otelcol-config.yaml:ro
      - ./observability/loki-config.yaml:/otel-lgtm/loki-config.yaml:ro
      - ./observability/tempo-config.yaml:/otel-lgtm/tempo-config.yaml:ro
      - ./observability/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - /root/YeshuaStorage/volatile/infra/telemetry:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      yeshua-net:
        aliases:
          - yeshua-telemetry

  nginx:
    image: nginx:1.27-alpine
    container_name: yeshua-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/routes:/etc/nginx/routes:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /root/YeshuaStorage:/storage:ro
    restart: unless-stopped
    networks:
      - yeshua-net

networks:
  yeshua-net:
    name: yeshua-net

volumes:
  operational-agent-workspace:
  operational-agent-codex:
  operational-agent-claude:
