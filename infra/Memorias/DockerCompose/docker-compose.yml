name: playsis-memorias

services:
  memorias-api:
    build:
      context: ../../..
      dockerfile: infra/Memorias/DockerCompose/Dockerfile
      target: api
      args:
        YESHUA_COMMIT_SHA: "${YESHUA_COMMIT_SHA:-UNSET}"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:7214"
      ASPNETCORE_ENVIRONMENT: "Production"
      YeshuaProcessing__Scope: "production"
      MemoriasYouTube__ClientId: "${YESHUA_MEMORIAS_YOUTUBE_CLIENT_ID:-}"
      MemoriasYouTube__ClientSecret: "${YESHUA_MEMORIAS_YOUTUBE_CLIENT_SECRET:-}"
      MemoriasYouTube__EncryptionKey: "${YESHUA_MEMORIAS_YOUTUBE_ENCRYPTION_KEY:-}"
      MemoriasYouTube__RedirectUri: "${YESHUA_MEMORIAS_YOUTUBE_REDIRECT_URI:-https://playsis.com.br/spa/youtube-callback.html}"
      MemoriasYouTube__CredentialsDirectory: "/memorias-secrets/accounts"
      MemoriasYouTube__ConfigurationAdminTenantId: "${YESHUA_MEMORIAS_CONFIG_ADMIN_TENANT_ID:-0}"
      MemoriasYouTube__ConfigurationAdminUserId: "${YESHUA_MEMORIAS_CONFIG_ADMIN_USER_ID:-0}"
      OpenTelemetry__ExportMode: "${YESHUA_TELEMETRY_EXPORT_MODE:-ConsoleJsonl}"
      OpenTelemetry__Otlp__Endpoint: "${YESHUA_TELEMETRY_OTLP_ENDPOINT:-http://yeshua-observability:4317}"
      JwtSettings__SecretKey: "${YESHUA_JWT_SECRET:?Configure credentials.json}"
      MYCONFIG__READCONECTIONSTRING: "${YESHUA_SQL_MEMORIAS_READ:?Configure credentials.json}"
      MYCONFIG__WRITECONECTIONSTRING: "${YESHUA_SQL_MEMORIAS_WRITE:?Configure credentials.json}"
      YESHUA_MEMORIAS_STORAGE_ROOT: "/storage"
      STORAGE_ROOT: "/storage"
      Storage__Providers__Disk__Root: "/storage"
      Storage__Providers__Disk__BaseUrl: "/storage"
      Storage__Locations__volatile/memorias/photos: "Disk"
      Storage__Locations__volatile/memorias/music: "Disk"
      Storage__Locations__volatile/memorias/publicacoes: "Disk"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__Username: "${YESHUA_RABBITMQ_USERNAME:?Configure credentials.json}"
      RabbitMq__Password: "${YESHUA_RABBITMQ_PASSWORD:?Configure credentials.json}"
      RabbitMq__VirtualHost: "/"
    expose:
      - "7214"
    volumes:
      - /root/YeshuaStorage:/storage
      - type: bind
        source: ${YESHUA_MEMORIAS_PRIVATE_ROOT:?Configure credentials.json}
        target: /memorias-secrets
        bind:
          create_host_path: false
    restart: unless-stopped
    networks:
      - yeshua-net

  memorias-worker:
    build:
      context: ../../..
      dockerfile: infra/Memorias/DockerCompose/Dockerfile
      target: worker
      args:
        YESHUA_COMMIT_SHA: "${YESHUA_COMMIT_SHA:-UNSET}"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:7215"
      ASPNETCORE_ENVIRONMENT: "Production"
      YeshuaProcessing__Scope: "production"
      MemoriasYouTube__ClientId: "${YESHUA_MEMORIAS_YOUTUBE_CLIENT_ID:-}"
      MemoriasYouTube__ClientSecret: "${YESHUA_MEMORIAS_YOUTUBE_CLIENT_SECRET:-}"
      MemoriasYouTube__EncryptionKey: "${YESHUA_MEMORIAS_YOUTUBE_ENCRYPTION_KEY:-}"
      MemoriasYouTube__RedirectUri: "${YESHUA_MEMORIAS_YOUTUBE_REDIRECT_URI:-https://playsis.com.br/spa/youtube-callback.html}"
      MemoriasYouTube__CredentialsDirectory: "/memorias-secrets/accounts"
      OpenTelemetry__ExportMode: "${YESHUA_TELEMETRY_EXPORT_MODE:-ConsoleJsonl}"
      OpenTelemetry__Otlp__Endpoint: "${YESHUA_TELEMETRY_OTLP_ENDPOINT:-http://yeshua-observability:4317}"
      MYCONFIG__READCONECTIONSTRING: "${YESHUA_SQL_MEMORIAS_READ:?Configure credentials.json}"
      MYCONFIG__WRITECONECTIONSTRING: "${YESHUA_SQL_MEMORIAS_WRITE:?Configure credentials.json}"
      YESHUA_MEMORIAS_STORAGE_ROOT: "/storage"
      STORAGE_ROOT: "/storage"
      Storage__Providers__Disk__Root: "/storage"
      Storage__Providers__Disk__BaseUrl: "/storage"
      Storage__Locations__volatile/memorias/photos: "Disk"
      Storage__Locations__volatile/memorias/music: "Disk"
      Storage__Locations__volatile/memorias/publicacoes: "Disk"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__Username: "${YESHUA_RABBITMQ_USERNAME:?Configure credentials.json}"
      RabbitMq__Password: "${YESHUA_RABBITMQ_PASSWORD:?Configure credentials.json}"
      RabbitMq__VirtualHost: "/"
      WorkerExecutionContext__TenantID: "1"
      WorkerExecutionContext__UserId: "1"
      OperationalControl__Enabled: "true"
      OperationalControl__ApplicationApiBaseUrl: "http://memorias-api:7214"
      OperationalControl__RefreshSeconds: "5"
    expose:
      - "7215"
    volumes:
      - /root/YeshuaStorage:/storage
      - type: bind
        source: ${YESHUA_MEMORIAS_PRIVATE_ROOT:?Configure credentials.json}
        target: /memorias-secrets
        bind:
          create_host_path: false
    restart: unless-stopped
    networks:
      - yeshua-net

  memorias-migration:
    build:
      context: ../../..
      dockerfile: infra/Memorias/DockerCompose/Dockerfile
      target: migration
      args:
        YESHUA_COMMIT_SHA: "${YESHUA_COMMIT_SHA:-UNSET}"
    environment:
      MYCONFIG__READCONECTIONSTRING: "${YESHUA_SQL_MEMORIAS_READ:?Configure credentials.json}"
      MYCONFIG__WRITECONECTIONSTRING: "${YESHUA_SQL_MEMORIAS_WRITE:?Configure credentials.json}"
      MYCONFIG__CENTRALAUTHORIZATIONCONECTIONSTRING: "${YESHUA_SQL_CENTRAL_AUTHORIZATION:?Configure credentials.json}"
    restart: "no"
    networks:
      - yeshua-net

  memorias-media-renderer:
    build:
      context: ./media-renderer
      dockerfile: Dockerfile
    environment:
      CELERY_BROKER_URL: "${YESHUA_CELERY_BROKER_URL:?Configure credentials.json}"
      STORAGE_ROOT: "/storage"
      FFMPEG_PRESET: "medium"
      FFMPEG_CRF: "18"
    volumes:
      - /root/YeshuaStorage:/storage
    restart: unless-stopped
    networks:
      - yeshua-net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

networks:
  yeshua-net:
    external: true
    name: yeshua-net
