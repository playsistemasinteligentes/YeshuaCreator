# generated: Dominio.Deployment.DockerComposeRenderer
# pendencia: criar os catalogos de banco antes da primeira migration em servidor vazio.
# observacao: os valores de segredo serao definidos em etapa posterior; este arquivo usa somente referencias.
name: "yeshua-production"
services:
  rabbit01:
    image: "rabbitmq:3-management-alpine"
    restart: unless-stopped
    environment:
      "RABBITMQ_DEFAULT_PASS": "${RABBIT01_PASSWORD}"
      "RABBITMQ_DEFAULT_USER": "${RABBIT01_USERNAME}"
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL","rabbitmq-diagnostics -q ping"]
      interval: 30s
      timeout: 5s
      retries: 10
    networks:
      - yeshua-net
  redis01:
    image: "redis:7-alpine"
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL","redis-cli ping"]
      interval: 30s
      timeout: 5s
      retries: 10
    networks:
      - yeshua-net
  sql01:
    image: "mcr.microsoft.com/mssql/server:2022-latest"
    restart: unless-stopped
    environment:
      "ACCEPT_EULA": "Y"
      "MSSQL_PID": "Express"
      "MSSQL_SA_PASSWORD": "${SQL01_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - "/root/YeshuaDB/persistent/sql:/var/opt/mssql"
    healthcheck:
      test: ["CMD-SHELL","bash -c \u0027\u003C/dev/tcp/127.0.0.1/1433\u0027"]
      interval: 30s
      timeout: 5s
      retries: 10
    networks:
      - yeshua-net
  clinica-ai-summarizer:
    build:
      context: "../../../docker/ai-summarizer"
      dockerfile: "Dockerfile"
    restart: "unless-stopped"
    environment:
      "CELERY_BROKER_URL": "${RABBIT01_CELERY_URL}"
      "SUMMARIZER_DEVICE": "cpu"
      "SUMMARIZER_MODEL": "Qwen/Qwen2.5-0.5B-Instruct"
    depends_on:
      rabbit01:
        condition: service_healthy
    cpus: "4"
    mem_limit: "8Gi"
    networks:
      - yeshua-net
  clinica-ai-worker:
    build:
      context: "../../../docker/ai-worker"
      dockerfile: "Dockerfile"
    restart: "unless-stopped"
    environment:
      "CELERY_BROKER_URL": "${RABBIT01_CELERY_URL}"
    depends_on:
      rabbit01:
        condition: service_healthy
    cpus: "4"
    mem_limit: "8Gi"
    networks:
      - yeshua-net
  clinica-api:
    build:
      context: "../../../.."
      dockerfile: "infra/Clinica/Migration/workloads/api/Dockerfile"
    restart: "unless-stopped"
    environment:
      "ASPNETCORE_ENVIRONMENT": "Production"
      "ASPNETCORE_URLS": "http://0.0.0.0:7214"
      "MYCONFIG__READCONECTIONSTRING": "${CLINICA_DATABASE_READ_CONNECTION}"
      "MYCONFIG__WRITECONECTIONSTRING": "${CLINICA_DATABASE_WRITE_CONNECTION}"
      "Redis__Host": "redis01"
      "Storage__Locations__persistent/docs/input": "Disk"
      "Storage__Locations__persistent/docs/output": "Disk"
      "Storage__Locations__volatile/ia/transcriptions/input": "Disk"
      "Storage__Locations__volatile/ia/transcriptions/output": "Disk"
      "Storage__Locations__volatile/reports/input": "Disk"
      "Storage__Locations__volatile/reports/output": "Disk"
      "Storage__Providers__Disk__BaseUrl": "https://playsis.com.br"
      "Storage__Providers__Disk__Root": "/storage"
    depends_on:
      redis01:
        condition: service_healthy
      sql01:
        condition: service_healthy
    expose:
      - "7214"
    volumes:
      - "/root/YeshuaStorage:/storage"
    healthcheck:
      test: ["CMD-SHELL","bash -c \u0027\u003C/dev/tcp/127.0.0.1/7214\u0027"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - yeshua-net
  clinica-front:
    build:
      context: "../../../.."
      dockerfile: "infra/Clinica/Migration/workloads/front/Dockerfile"
    restart: "unless-stopped"
    environment:
      "ASPNETCORE_ENVIRONMENT": "Production"
      "ASPNETCORE_URLS": "http://0.0.0.0:8080"
    depends_on:
      clinica-api:
        condition: service_started
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL","bash -c \u0027\u003C/dev/tcp/127.0.0.1/8080\u0027"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 2
    networks:
      - yeshua-net
  clinica-migration:
    build:
      context: "../../../.."
      dockerfile: "infra/Clinica/Migration/workloads/migration/Dockerfile"
    restart: "no"
    profiles:
      - jobs
    environment:
      "MYCONFIG__READCONECTIONSTRING": "${CLINICA_DATABASE_READ_CONNECTION}"
      "MYCONFIG__WRITECONECTIONSTRING": "${CLINICA_DATABASE_WRITE_CONNECTION}"
    depends_on:
      sql01:
        condition: service_healthy
    networks:
      - yeshua-net
  clinica-worker:
    build:
      context: "../../../.."
      dockerfile: "infra/Clinica/Migration/workloads/worker/Dockerfile"
    restart: "unless-stopped"
    environment:
      "ASPNETCORE_ENVIRONMENT": "Production"
      "ASPNETCORE_URLS": "http://0.0.0.0:7215"
      "MYCONFIG__READCONECTIONSTRING": "${CLINICA_DATABASE_READ_CONNECTION}"
      "MYCONFIG__WRITECONECTIONSTRING": "${CLINICA_DATABASE_WRITE_CONNECTION}"
      "RabbitMq__Exchange": "kiwi.exchange"
      "RabbitMq__HostName": "rabbit01"
      "RabbitMq__Password": "${RABBIT01_PASSWORD}"
      "RabbitMq__Port": "5672"
      "RabbitMq__Queue": "kiwi.queue"
      "RabbitMq__RoutingKey": "kiwi.routing"
      "RabbitMq__Username": "${RABBIT01_USERNAME}"
      "RabbitMq__VirtualHost": "/"
      "Redis__Host": "redis01"
      "Storage__Locations__persistent/docs/input": "Disk"
      "Storage__Locations__persistent/docs/output": "Disk"
      "Storage__Locations__volatile/ia/transcriptions/input": "Disk"
      "Storage__Locations__volatile/ia/transcriptions/output": "Disk"
      "Storage__Locations__volatile/reports/input": "Disk"
      "Storage__Locations__volatile/reports/output": "Disk"
      "Storage__Providers__Disk__BaseUrl": "https://playsis.com.br"
      "Storage__Providers__Disk__Root": "/storage"
    depends_on:
      rabbit01:
        condition: service_healthy
      redis01:
        condition: service_healthy
      sql01:
        condition: service_healthy
    expose:
      - "7215"
    volumes:
      - "/root/YeshuaStorage:/storage"
    healthcheck:
      test: ["CMD-SHELL","bash -c \u0027\u003C/dev/tcp/127.0.0.1/7215\u0027"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - yeshua-net
  fiscal-mdfe-api:
    build:
      context: "../../../.."
      dockerfile: "infra/Fiscal.MDFe/Migration/workloads/api/Dockerfile"
    restart: "unless-stopped"
    environment:
      "ASPNETCORE_ENVIRONMENT": "Production"
      "ASPNETCORE_URLS": "http://0.0.0.0:7214"
      "MYCONFIG__READCONECTIONSTRING": "${MDFE_DATABASE_READ_CONNECTION}"
      "MYCONFIG__WRITECONECTIONSTRING": "${MDFE_DATABASE_WRITE_CONNECTION}"
    depends_on:
      sql01:
        condition: service_healthy
    expose:
      - "7214"
    healthcheck:
      test: ["CMD-SHELL","bash -c \u0027\u003C/dev/tcp/127.0.0.1/7214\u0027"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - yeshua-net
  fiscal-mdfe-front:
    build:
      context: "../../../.."
      dockerfile: "infra/Fiscal.MDFe/Migration/workloads/front/Dockerfile"
    restart: "unless-stopped"
    environment:
      "ASPNETCORE_ENVIRONMENT": "Production"
      "ASPNETCORE_URLS": "http://0.0.0.0:8080"
    depends_on:
      fiscal-mdfe-api:
        condition: service_started
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL","bash -c \u0027\u003C/dev/tcp/127.0.0.1/8080\u0027"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - yeshua-net
  fiscal-mdfe-migration:
    build:
      context: "../../../.."
      dockerfile: "infra/Fiscal.MDFe/Migration/workloads/migration/Dockerfile"
    restart: "no"
    profiles:
      - jobs
    environment:
      "MYCONFIG__READCONECTIONSTRING": "${MDFE_DATABASE_READ_CONNECTION}"
      "MYCONFIG__WRITECONECTIONSTRING": "${MDFE_DATABASE_WRITE_CONNECTION}"
    depends_on:
      sql01:
        condition: service_healthy
    networks:
      - yeshua-net
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./nginx/conf.d:/etc/nginx/conf.d:ro"
      - "/etc/letsencrypt:/etc/letsencrypt:ro"
      - "/root/YeshuaStorage:/storage:ro"
    networks:
      - yeshua-net
networks:
  yeshua-net:
    name: yeshua-net
