name: playsis-aps-adm

services:
  aps-adm-api:
    build:
      context: ../../..
      dockerfile: infra/APS.ADM/DockerCompose/Dockerfile
      target: api
      args:
        YESHUA_COMMIT_SHA: "${YESHUA_COMMIT_SHA:-UNSET}"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:7214"
      ASPNETCORE_ENVIRONMENT: "Production"
      YeshuaProcessing__Scope: "production"
      OpenTelemetry__ExportMode: "${YESHUA_TELEMETRY_EXPORT_MODE:-ConsoleJsonl}"
      OpenTelemetry__Otlp__Endpoint: "${YESHUA_TELEMETRY_OTLP_ENDPOINT:-http://yeshua-telemetry:4317}"
      JwtSettings__SecretKey: "${YESHUA_JWT_SECRET:?Configure credentials.json}"
      YeshuaModules__Authentication__SharedKey: "${YESHUA_MODULE_SHARED_KEY:?Configure credentials.json}"
      YeshuaModules__Authentication__MaxClockSkewSeconds: "300"
      YeshuaModules__Authentication__TechnicalUserId: "1"
      MYCONFIG__READCONECTIONSTRING: "${YESHUA_SQL_APS_ADM_READ:?Configure credentials.json}"
      MYCONFIG__WRITECONECTIONSTRING: "${YESHUA_SQL_APS_ADM_WRITE:?Configure credentials.json}"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__UserName: "${YESHUA_RABBITMQ_USERNAME:?Configure credentials.json}"
      RabbitMq__Password: "${YESHUA_RABBITMQ_PASSWORD:?Configure credentials.json}"
      RabbitMq__VirtualHost: "/"
      Storage__Providers__Disk__Root: "/storage"
      Storage__Locations__volatile/aps-adm/uploads: "Disk"
    volumes:
      - /root/YeshuaStorage:/storage
    expose:
      - "7214"
    restart: unless-stopped
    networks:
      - yeshua-net

  aps-adm-worker:
    build:
      context: ../../..
      dockerfile: infra/APS.ADM/DockerCompose/Dockerfile
      target: worker
      args:
        YESHUA_COMMIT_SHA: "${YESHUA_COMMIT_SHA:-UNSET}"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:7215"
      ASPNETCORE_ENVIRONMENT: "Production"
      YeshuaProcessing__Scope: "production"
      OpenTelemetry__ExportMode: "${YESHUA_TELEMETRY_EXPORT_MODE:-ConsoleJsonl}"
      OpenTelemetry__Otlp__Endpoint: "${YESHUA_TELEMETRY_OTLP_ENDPOINT:-http://yeshua-telemetry:4317}"
      MYCONFIG__READCONECTIONSTRING: "${YESHUA_SQL_APS_ADM_READ:?Configure credentials.json}"
      MYCONFIG__WRITECONECTIONSTRING: "${YESHUA_SQL_APS_ADM_WRITE:?Configure credentials.json}"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__UserName: "${YESHUA_RABBITMQ_USERNAME:?Configure credentials.json}"
      RabbitMq__Password: "${YESHUA_RABBITMQ_PASSWORD:?Configure credentials.json}"
      RabbitMq__VirtualHost: "/"
      YeshuaModules__Fiscal__BaseUrl: "http://fiscal-api:7214"
      YeshuaModules__Authentication__SourceModule: "APS.ADM"
      YeshuaModules__Authentication__SharedKey: "${YESHUA_MODULE_SHARED_KEY:?Configure credentials.json}"
      YeshuaModules__Authentication__MaxClockSkewSeconds: "300"
      WorkerExecutionContext__TenantID: "1"
      WorkerExecutionContext__UserId: "1"
      OperationalControl__Enabled: "true"
      OperationalControl__ApplicationApiBaseUrl: "http://aps-adm-api:7214"
      OperationalControl__RefreshSeconds: "5"
    expose:
      - "7215"
    restart: unless-stopped
    networks:
      - yeshua-net

  aps-adm-migration:
    build:
      context: ../../..
      dockerfile: infra/APS.ADM/DockerCompose/Dockerfile
      target: migration
      args:
        YESHUA_COMMIT_SHA: "${YESHUA_COMMIT_SHA:-UNSET}"
    environment:
      MYCONFIG__READCONECTIONSTRING: "${YESHUA_SQL_APS_ADM_READ:?Configure credentials.json}"
      MYCONFIG__WRITECONECTIONSTRING: "${YESHUA_SQL_APS_ADM_WRITE:?Configure credentials.json}"
      MYCONFIG__CENTRALAUTHORIZATIONCONECTIONSTRING: "${YESHUA_SQL_CENTRAL_AUTHORIZATION:?Configure credentials.json}"
    restart: "no"
    networks:
      - yeshua-net

networks:
  yeshua-net:
    external: true
    name: yeshua-net
