name: playsis-aps-adm

services:
  aps-adm-api:
    build:
      context: ../../..
      dockerfile: infra/APS.ADM/DockerCompose/Dockerfile
      target: api
      args:
        YESHUA_COMMIT_SHA: "${YESHUA_COMMIT_SHA:-UNSET}"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:7214"
      ASPNETCORE_ENVIRONMENT: "Production"
      YeshuaProcessing__Scope: "production"
      OpenTelemetry__ExportMode: "${YESHUA_TELEMETRY_EXPORT_MODE:-ConsoleJsonl}"
      OpenTelemetry__Otlp__Endpoint: "${YESHUA_TELEMETRY_OTLP_ENDPOINT:-http://yeshua-telemetry:4317}"
      JwtSettings__SecretKey: "${YESHUA_JWT_SECRET:-configure-using-user-secrets-or-environment-variables}"
      YeshuaModules__Authentication__SharedKey: "${YESHUA_MODULE_SHARED_KEY:?YESHUA_MODULE_SHARED_KEY must be configured}"
      YeshuaModules__Authentication__MaxClockSkewSeconds: "300"
      YeshuaModules__Authentication__TechnicalUserId: "1"
      MYCONFIG__READCONECTIONSTRING: "Server=sqlserver,1433;Database=${YESHUA_DB_APS_ADM:-YESHUA_APS_ADM};User Id=sa;Password=123qwe!@#QWE;TrustServerCertificate=True;"
      MYCONFIG__WRITECONECTIONSTRING: "Server=sqlserver,1433;Database=${YESHUA_DB_APS_ADM:-YESHUA_APS_ADM};User Id=sa;Password=123qwe!@#QWE;TrustServerCertificate=True;"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__UserName: "yeshua"
      RabbitMq__Password: "yeshua123"
      RabbitMq__VirtualHost: "/"
    expose:
      - "7214"
    restart: unless-stopped
    networks:
      - yeshua-net

  aps-adm-worker:
    build:
      context: ../../..
      dockerfile: infra/APS.ADM/DockerCompose/Dockerfile
      target: worker
      args:
        YESHUA_COMMIT_SHA: "${YESHUA_COMMIT_SHA:-UNSET}"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:7215"
      ASPNETCORE_ENVIRONMENT: "Production"
      YeshuaProcessing__Scope: "production"
      OpenTelemetry__ExportMode: "${YESHUA_TELEMETRY_EXPORT_MODE:-ConsoleJsonl}"
      OpenTelemetry__Otlp__Endpoint: "${YESHUA_TELEMETRY_OTLP_ENDPOINT:-http://yeshua-telemetry:4317}"
      MYCONFIG__READCONECTIONSTRING: "Server=sqlserver,1433;Database=${YESHUA_DB_APS_ADM:-YESHUA_APS_ADM};User Id=sa;Password=123qwe!@#QWE;TrustServerCertificate=True;"
      MYCONFIG__WRITECONECTIONSTRING: "Server=sqlserver,1433;Database=${YESHUA_DB_APS_ADM:-YESHUA_APS_ADM};User Id=sa;Password=123qwe!@#QWE;TrustServerCertificate=True;"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__UserName: "yeshua"
      RabbitMq__Password: "yeshua123"
      RabbitMq__VirtualHost: "/"
      YeshuaModules__Fiscal__BaseUrl: "http://fiscal-api:7214"
      YeshuaModules__Authentication__SourceModule: "APS.ADM"
      YeshuaModules__Authentication__SharedKey: "${YESHUA_MODULE_SHARED_KEY:?YESHUA_MODULE_SHARED_KEY must be configured}"
      YeshuaModules__Authentication__MaxClockSkewSeconds: "300"
      WorkerExecutionContext__TenantID: "1"
      WorkerExecutionContext__UserId: "1"
      OperationalControl__Enabled: "true"
      OperationalControl__ApplicationApiBaseUrl: "http://aps-adm-api:7214"
      OperationalControl__RefreshSeconds: "5"
    expose:
      - "7215"
    restart: unless-stopped
    networks:
      - yeshua-net

  aps-adm-migration:
    build:
      context: ../../..
      dockerfile: infra/APS.ADM/DockerCompose/Dockerfile
      target: migration
      args:
        YESHUA_COMMIT_SHA: "${YESHUA_COMMIT_SHA:-UNSET}"
    environment:
      MYCONFIG__READCONECTIONSTRING: "Server=sqlserver,1433;Database=${YESHUA_DB_APS_ADM:-YESHUA_APS_ADM};User Id=sa;Password=123qwe!@#QWE;TrustServerCertificate=True;"
      MYCONFIG__WRITECONECTIONSTRING: "Server=sqlserver,1433;Database=${YESHUA_DB_APS_ADM:-YESHUA_APS_ADM};User Id=sa;Password=123qwe!@#QWE;TrustServerCertificate=True;"
      MYCONFIG__CENTRALAUTHORIZATIONCONECTIONSTRING: "Server=sqlserver,1433;Database=${YESHUA_DB_CENTRAL:-YESHUA_CENTRAL};User Id=sa;Password=123qwe!@#QWE;TrustServerCertificate=True;"
    restart: "no"
    networks:
      - yeshua-net

networks:
  yeshua-net:
    external: true
    name: yeshua-net
