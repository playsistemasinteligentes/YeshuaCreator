name: playsis-central

services:
  central-front:
    build:
      context: ../../..
      dockerfile: infra/Central/DockerCompose/Dockerfile
      target: front
      args:
        YESHUA_COMMIT_SHA: "${YESHUA_COMMIT_SHA:-UNSET}"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - yeshua-net

  central-api:
    build:
      context: ../../..
      dockerfile: infra/Central/DockerCompose/Dockerfile
      target: api
      args:
        YESHUA_COMMIT_SHA: "${YESHUA_COMMIT_SHA:-UNSET}"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:7214"
      ASPNETCORE_ENVIRONMENT: "Production"
      YeshuaProcessing__Scope: "production"
      Billing__SandboxEnabled: "${YESHUA_BILLING_SANDBOX_ENABLED:-false}"
      UploadTokens__SigningKey: "${CENTRAL_UPLOAD_SIGNING_KEY:?Configure credentials.json}"
      Storage__Providers__Disk__Root: "/storage"
      Storage__Providers__Disk__BaseUrl: "https://playsis.com.br"
      Storage__Locations__volatile/ia/transcriptions/input: "Disk"
      Storage__Locations__volatile/ia/transcriptions/output: "Disk"
      OpenTelemetry__ExportMode: "${YESHUA_TELEMETRY_EXPORT_MODE:-ConsoleJsonl}"
      OpenTelemetry__Otlp__Endpoint: "${YESHUA_TELEMETRY_OTLP_ENDPOINT:-http://yeshua-observability:4317}"
      JwtSettings__SecretKey: "${YESHUA_JWT_SECRET:?Configure credentials.json}"
      MYCONFIG__READCONECTIONSTRING: "${YESHUA_SQL_CENTRAL_READ:?Configure credentials.json}"
      MYCONFIG__WRITECONECTIONSTRING: "${YESHUA_SQL_CENTRAL_WRITE:?Configure credentials.json}"
    volumes:
      - /root/YeshuaStorage:/storage
    expose:
      - "7214"
    restart: unless-stopped
    networks:
      - yeshua-net

  central-worker:
    build:
      context: ../../..
      dockerfile: infra/Central/DockerCompose/Dockerfile
      target: worker
      args:
        YESHUA_COMMIT_SHA: "${YESHUA_COMMIT_SHA:-UNSET}"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:7215"
      ASPNETCORE_ENVIRONMENT: "Production"
      YeshuaProcessing__Scope: "production"
      UploadTokens__SigningKey: "${CENTRAL_UPLOAD_SIGNING_KEY:?Configure credentials.json}"
      Storage__Providers__Disk__Root: "/storage"
      Storage__Providers__Disk__BaseUrl: "https://playsis.com.br"
      Storage__Locations__volatile/ia/transcriptions/input: "Disk"
      Storage__Locations__volatile/ia/transcriptions/output: "Disk"
      OpenTelemetry__ExportMode: "${YESHUA_TELEMETRY_EXPORT_MODE:-ConsoleJsonl}"
      OpenTelemetry__Otlp__Endpoint: "${YESHUA_TELEMETRY_OTLP_ENDPOINT:-http://yeshua-observability:4317}"
      OperationalControl__Enabled: "true"
      OperationalControl__ApplicationApiBaseUrl: "http://central-api:7214"
      OperationalControl__RefreshSeconds: "5"
      MYCONFIG__READCONECTIONSTRING: "${YESHUA_SQL_CENTRAL_READ:?Configure credentials.json}"
      MYCONFIG__WRITECONECTIONSTRING: "${YESHUA_SQL_CENTRAL_WRITE:?Configure credentials.json}"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__Username: "${YESHUA_RABBITMQ_USERNAME:?Configure credentials.json}"
      RabbitMq__Password: "${YESHUA_RABBITMQ_PASSWORD:?Configure credentials.json}"
      RabbitMq__VirtualHost: "/"
      CentralTranscription__Provider: "${CENTRAL_TRANSCRIPTION_PROVIDER:-OpenAI}"
      CentralTranscription__ApiKey: "${CENTRAL_TRANSCRIPTION_API_KEY:-}"
      CentralTranscription__Model: "${CENTRAL_TRANSCRIPTION_MODEL:-gpt-transcribe}"
      CentralTranscription__BaseUrl: "${CENTRAL_TRANSCRIPTION_BASE_URL:-https://api.openai.com/v1}"
      CentralTranscription__Groq__ApiKey: "${CENTRAL_GROQ_API_KEY:-}"
      CentralTranscription__Groq__Model: "${CENTRAL_GROQ_MODEL:-whisper-large-v3-turbo}"
      CentralTranscription__Groq__BaseUrl: "${CENTRAL_GROQ_BASE_URL:-https://api.groq.com/openai/v1}"
    volumes:
      - /root/YeshuaStorage:/storage
    expose:
      - "7215"
    restart: unless-stopped
    networks:
      - yeshua-net

  central-migration:
    build:
      context: ../../..
      dockerfile: infra/Central/DockerCompose/Dockerfile
      target: migration
      args:
        YESHUA_COMMIT_SHA: "${YESHUA_COMMIT_SHA:-UNSET}"
    environment:
      MYCONFIG__READCONECTIONSTRING: "${YESHUA_SQL_CENTRAL_READ:?Configure credentials.json}"
      MYCONFIG__WRITECONECTIONSTRING: "${YESHUA_SQL_CENTRAL_WRITE:?Configure credentials.json}"
      MYCONFIG__CENTRALAUTHORIZATIONCONECTIONSTRING: "${YESHUA_SQL_CENTRAL_AUTHORIZATION:?Configure credentials.json}"
    restart: "no"
    networks:
      - yeshua-net

networks:
  yeshua-net:
    external: true
    name: yeshua-net
