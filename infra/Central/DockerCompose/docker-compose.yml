name: playsis-central

services:
  central-front:
    build:
      context: ../../..
      dockerfile: infra/Central/DockerCompose/front/Dockerfile
      args:
        YESHUA_COMMIT_SHA: "${YESHUA_COMMIT_SHA:-UNSET}"
        YESHUA_BUILD_TIMESTAMP_UTC: "${YESHUA_BUILD_TIMESTAMP_UTC:-UNSET}"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - yeshua-net

  central-api:
    build:
      context: ../../..
      dockerfile: infra/Central/DockerCompose/api/Dockerfile
      args:
        YESHUA_COMMIT_SHA: "${YESHUA_COMMIT_SHA:-UNSET}"
        YESHUA_BUILD_TIMESTAMP_UTC: "${YESHUA_BUILD_TIMESTAMP_UTC:-UNSET}"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:7214"
      ASPNETCORE_ENVIRONMENT: "Production"
      JwtSettings__SecretKey: "${YESHUA_JWT_SECRET:-configure-using-user-secrets-or-environment-variables}"
      MYCONFIG__READCONECTIONSTRING: "Server=sqlserver,1433;Database=CENTRAL_;User Id=sa;Password=123qwe!@#QWE;TrustServerCertificate=True;"
      MYCONFIG__WRITECONECTIONSTRING: "Server=sqlserver,1433;Database=CENTRAL_;User Id=sa;Password=123qwe!@#QWE;TrustServerCertificate=True;"
    expose:
      - "7214"
    restart: unless-stopped
    networks:
      - yeshua-net

  central-worker:
    build:
      context: ../../..
      dockerfile: infra/Central/DockerCompose/worker/Dockerfile
      args:
        YESHUA_COMMIT_SHA: "${YESHUA_COMMIT_SHA:-UNSET}"
        YESHUA_BUILD_TIMESTAMP_UTC: "${YESHUA_BUILD_TIMESTAMP_UTC:-UNSET}"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:7215"
      ASPNETCORE_ENVIRONMENT: "Production"
      OperationalControl__Enabled: "true"
      OperationalControl__ApplicationApiBaseUrl: "http://central-api:7214"
      OperationalControl__RefreshSeconds: "5"
      MYCONFIG__READCONECTIONSTRING: "Server=sqlserver,1433;Database=CENTRAL_;User Id=sa;Password=123qwe!@#QWE;TrustServerCertificate=True;"
      MYCONFIG__WRITECONECTIONSTRING: "Server=sqlserver,1433;Database=CENTRAL_;User Id=sa;Password=123qwe!@#QWE;TrustServerCertificate=True;"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__Username: "yeshua"
      RabbitMq__Password: "yeshua123"
      RabbitMq__VirtualHost: "/"
    expose:
      - "7215"
    restart: unless-stopped
    networks:
      - yeshua-net

  central-migration:
    build:
      context: ../../..
      dockerfile: infra/Central/DockerCompose/migration/Dockerfile
    environment:
      MYCONFIG__READCONECTIONSTRING: "Server=sqlserver,1433;Database=CENTRAL_;User Id=sa;Password=123qwe!@#QWE;TrustServerCertificate=True;"
      MYCONFIG__WRITECONECTIONSTRING: "Server=sqlserver,1433;Database=CENTRAL_;User Id=sa;Password=123qwe!@#QWE;TrustServerCertificate=True;"
      MYCONFIG__CENTRALAUTHORIZATIONCONECTIONSTRING: "Server=sqlserver,1433;Database=CENTRAL_;User Id=sa;Password=123qwe!@#QWE;TrustServerCertificate=True;"
    restart: "no"
    networks:
      - yeshua-net

networks:
  yeshua-net:
    external: true
    name: yeshua-net
