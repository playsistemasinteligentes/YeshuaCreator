name: playsis-clinica

services:
  clinica-api:
    build:
      context: ../../..
      dockerfile: infra/Clinica/DockerCompose/api/Dockerfile
      args:
        YESHUA_COMMIT_SHA: "${YESHUA_COMMIT_SHA:-UNSET}"
        YESHUA_BUILD_TIMESTAMP_UTC: "${YESHUA_BUILD_TIMESTAMP_UTC:-UNSET}"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:7214"
      ASPNETCORE_ENVIRONMENT: "Production"
      JwtSettings__SecretKey: "${YESHUA_JWT_SECRET:-configure-using-user-secrets-or-environment-variables}"
      MYCONFIG__READCONECTIONSTRING: "Server=sqlserver,1433;Database=CLINICA;User Id=sa;Password=123qwe!@#QWE;TrustServerCertificate=True;"
      MYCONFIG__WRITECONECTIONSTRING: "Server=sqlserver,1433;Database=CLINICA;User Id=sa;Password=123qwe!@#QWE;TrustServerCertificate=True;"
      Storage__Providers__Disk__Root: "/storage"
      Storage__Providers__Disk__BaseUrl: "https://playsis.com.br"
      Storage__Locations__volatile/ia/transcriptions/input: "Disk"
      Storage__Locations__volatile/ia/transcriptions/output: "Disk"
      Storage__Locations__volatile/reports/input: "Disk"
      Storage__Locations__volatile/reports/output: "Disk"
      Storage__Locations__persistent/docs/input: "Disk"
      Storage__Locations__persistent/docs/output: "Disk"
    expose:
      - "7214"
    volumes:
      - /root/YeshuaStorage:/storage
    restart: unless-stopped
    networks:
      - yeshua-net

  clinica-worker:
    build:
      context: ../../..
      dockerfile: infra/Clinica/DockerCompose/worker/Dockerfile
      args:
        YESHUA_COMMIT_SHA: "${YESHUA_COMMIT_SHA:-UNSET}"
        YESHUA_BUILD_TIMESTAMP_UTC: "${YESHUA_BUILD_TIMESTAMP_UTC:-UNSET}"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:7215"
      ASPNETCORE_ENVIRONMENT: "Production"
      OperationalControl__Enabled: "true"
      OperationalControl__ApplicationApiBaseUrl: "http://clinica-api:7214"
      OperationalControl__RefreshSeconds: "5"
      MYCONFIG__READCONECTIONSTRING: "Server=sqlserver,1433;Database=CLINICA;User Id=sa;Password=123qwe!@#QWE;TrustServerCertificate=True;"
      MYCONFIG__WRITECONECTIONSTRING: "Server=sqlserver,1433;Database=CLINICA;User Id=sa;Password=123qwe!@#QWE;TrustServerCertificate=True;"
      Storage__Providers__Disk__Root: "/storage"
      Storage__Providers__Disk__BaseUrl: "https://playsis.com.br"
      Storage__Locations__volatile/ia/transcriptions/input: "Disk"
      Storage__Locations__volatile/ia/transcriptions/output: "Disk"
      Storage__Locations__volatile/reports/input: "Disk"
      Storage__Locations__volatile/reports/output: "Disk"
      Storage__Locations__persistent/docs/input: "Disk"
      Storage__Locations__persistent/docs/output: "Disk"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: yeshua
      RabbitMq__Password: yeshua123
      RabbitMq__VirtualHost: /
    expose:
      - "7215"
    volumes:
      - /root/YeshuaStorage:/storage
    restart: unless-stopped
    networks:
      - yeshua-net

  clinica-migration:
    build:
      context: ../../..
      dockerfile: infra/Clinica/DockerCompose/migration/Dockerfile
    environment:
      MYCONFIG__READCONECTIONSTRING: "Server=sqlserver,1433;Database=CLINICA;User Id=sa;Password=123qwe!@#QWE;TrustServerCertificate=True;"
      MYCONFIG__WRITECONECTIONSTRING: "Server=sqlserver,1433;Database=CLINICA;User Id=sa;Password=123qwe!@#QWE;TrustServerCertificate=True;"
      MYCONFIG__CENTRALAUTHORIZATIONCONECTIONSTRING: "Server=sqlserver,1433;Database=CENTRAL_;User Id=sa;Password=123qwe!@#QWE;TrustServerCertificate=True;"
    restart: "no"
    networks:
      - yeshua-net

