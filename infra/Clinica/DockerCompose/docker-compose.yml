name: playsis-clinica

services:
  clinica-api:
    build:
      context: ../../..
      dockerfile: infra/Clinica/DockerCompose/Dockerfile
      target: api
      args:
        YESHUA_COMMIT_SHA: "${YESHUA_COMMIT_SHA:-UNSET}"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:7214"
      ASPNETCORE_ENVIRONMENT: "Production"
      YeshuaProcessing__Scope: "production"
      OpenTelemetry__ExportMode: "${YESHUA_TELEMETRY_EXPORT_MODE:-ConsoleJsonl}"
      OpenTelemetry__Otlp__Endpoint: "${YESHUA_TELEMETRY_OTLP_ENDPOINT:-http://yeshua-observability:4317}"
      JwtSettings__SecretKey: "${YESHUA_JWT_SECRET:?Configure credentials.json}"
      UploadTokens__SigningKey: "${YESHUA_CLINICA_UPLOAD_SIGNING_KEY:?Configure credentials.json}"
      MYCONFIG__READCONECTIONSTRING: "${YESHUA_SQL_CLINICA_READ:?Configure credentials.json}"
      MYCONFIG__WRITECONECTIONSTRING: "${YESHUA_SQL_CLINICA_WRITE:?Configure credentials.json}"
      Storage__Providers__Disk__Root: "/storage"
      Storage__Providers__Disk__BaseUrl: "https://playsis.com.br"
      Storage__Locations__volatile/ia/transcriptions/input: "Disk"
      Storage__Locations__volatile/ia/transcriptions/output: "Disk"
      Storage__Locations__volatile/reports/input: "Disk"
      Storage__Locations__volatile/reports/output: "Disk"
      Storage__Locations__volatile/clinica/uploads: "Disk"
    expose:
      - "7214"
    volumes:
      - /root/YeshuaStorage:/storage
    restart: unless-stopped
    networks:
      - yeshua-net

  clinica-worker:
    build:
      context: ../../..
      dockerfile: infra/Clinica/DockerCompose/Dockerfile
      target: worker
      args:
        YESHUA_COMMIT_SHA: "${YESHUA_COMMIT_SHA:-UNSET}"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:7215"
      ASPNETCORE_ENVIRONMENT: "Production"
      YeshuaProcessing__Scope: "production"
      OpenTelemetry__ExportMode: "${YESHUA_TELEMETRY_EXPORT_MODE:-ConsoleJsonl}"
      OpenTelemetry__Otlp__Endpoint: "${YESHUA_TELEMETRY_OTLP_ENDPOINT:-http://yeshua-observability:4317}"
      OperationalControl__Enabled: "true"
      OperationalControl__ApplicationApiBaseUrl: "http://clinica-api:7214"
      OperationalControl__RefreshSeconds: "5"
      MYCONFIG__READCONECTIONSTRING: "${YESHUA_SQL_CLINICA_READ:?Configure credentials.json}"
      MYCONFIG__WRITECONECTIONSTRING: "${YESHUA_SQL_CLINICA_WRITE:?Configure credentials.json}"
      Storage__Providers__Disk__Root: "/storage"
      Storage__Providers__Disk__BaseUrl: "https://playsis.com.br"
      Storage__Locations__volatile/ia/transcriptions/input: "Disk"
      Storage__Locations__volatile/ia/transcriptions/output: "Disk"
      Storage__Locations__volatile/reports/input: "Disk"
      Storage__Locations__volatile/reports/output: "Disk"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: "${YESHUA_RABBITMQ_USERNAME:?Configure credentials.json}"
      RabbitMq__Password: "${YESHUA_RABBITMQ_PASSWORD:?Configure credentials.json}"
      RabbitMq__VirtualHost: /
      ClinicaTranscription__Provider: "${CLINICA_TRANSCRIPTION_PROVIDER:-OpenAI}"
      ClinicaTranscription__ApiKey: "${CLINICA_TRANSCRIPTION_API_KEY:-}"
      ClinicaTranscription__Model: "${CLINICA_TRANSCRIPTION_MODEL:-gpt-transcribe}"
      ClinicaTranscription__BaseUrl: "${CLINICA_TRANSCRIPTION_BASE_URL:-https://api.openai.com/v1}"
      ClinicaTranscription__FFmpegExecutable: "/usr/bin/ffmpeg"
    expose:
      - "7215"
    volumes:
      - /root/YeshuaStorage:/storage
    restart: unless-stopped
    networks:
      - yeshua-net

  clinica-migration:
    build:
      context: ../../..
      dockerfile: infra/Clinica/DockerCompose/Dockerfile
      target: migration
      args:
        YESHUA_COMMIT_SHA: "${YESHUA_COMMIT_SHA:-UNSET}"
    environment:
      MYCONFIG__READCONECTIONSTRING: "${YESHUA_SQL_CLINICA_READ:?Configure credentials.json}"
      MYCONFIG__WRITECONECTIONSTRING: "${YESHUA_SQL_CLINICA_WRITE:?Configure credentials.json}"
      MYCONFIG__CENTRALAUTHORIZATIONCONECTIONSTRING: "${YESHUA_SQL_CENTRAL_AUTHORIZATION:?Configure credentials.json}"
    restart: "no"
    networks:
      - yeshua-net

