

server {
    listen 443 ssl;
    server_name playsis.com.br;

    ssl_certificate /etc/letsencrypt/live/playsis.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playsis.com.br/privkey.pem;

    location /volatile/ {
        alias /storage/volatile/;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        types {
            video/webm webm;
            audio/mpeg mp3;
            audio/wav wav;
        }

        default_type application/octet-stream;
        expires 30d;
        add_header Cache-Control "public";
    }
    
    location /yapi/ {
        proxy_pass http://api_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /yworker/ {
        proxy_pass http://worker_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://front_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
