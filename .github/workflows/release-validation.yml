name: Release validation

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --test tests/ReleaseAutomation/*.test.cjs
      - name: Validate scope labels
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { classify } = require('./scripts/component-release/release.cjs');
            core.info(`Componentes: ${classify(context.payload.pull_request.labels).join(', ')}`);
