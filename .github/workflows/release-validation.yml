name: Release validation

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Prepare browser tests
        run: |
          npm install --prefix /tmp/yeshua-release-ui --no-audit --no-fund playwright@1.65.1
          node /tmp/yeshua-release-ui/node_modules/playwright/cli.js install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/yeshua-release-browsers
      - run: node --test tests/ReleaseAutomation/*.test.cjs tests/Front/Central/component-releases.test.cjs
        env:
          RUN_RELEASE_BUILD_TESTS: '1'
          RUN_RELEASE_UI_TESTS: '1'
          NODE_PATH: /tmp/yeshua-release-ui/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/yeshua-release-browsers
      - run: node tests/Front/Central/release-footer.cjs
        env:
          NODE_PATH: /tmp/yeshua-release-ui/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/yeshua-release-browsers
