name: Release readiness

on:
  workflow_dispatch:
    inputs:
      create_labels:
        description: Criar somente labels de escopo ausentes (nao ativa tags)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-readiness
  cancel-in-progress: false

jobs:
  labels:
    if: inputs.create_labels && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { provisionLabels } = require('./scripts/component-release/readiness.cjs');
            core.info(JSON.stringify(await provisionLabels(github, context.repo)));

  audit:
    needs: labels
    if: >-
      always() && !cancelled() &&
      (needs.labels.result == 'success' || needs.labels.result == 'skipped') &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - run: node --test tests/ReleaseAutomation/*.test.cjs
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          RELEASE_TAGGING_ENABLED: ${{ vars.RELEASE_TAGGING_ENABLED }}
        with:
          script: |
            const { audit } = require('./scripts/component-release/readiness.cjs');
            const result = await audit(github, context.repo, process.env.RELEASE_TAGGING_ENABLED);
            await core.summary.addHeading('Auditoria de ativacao')
              .addCodeBlock(JSON.stringify(result, null, 2), 'json').write();
            if (!result.ready) core.setFailed('Ativacao pendente: consultar falhas e verificacoes humanas no resumo.');
