name: Component release

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR ja mergeada na branch padrao (recuperacao sem deploy)
        required: true
        type: string
      dry_run:
        description: Simular sem criar objetos Git ou tags
        required: true
        type: boolean
        default: true

permissions: {}

# Serializa reexecucoes da mesma PR sem cancelar releases de outros merges.
concurrency:
  group: component-release-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true) ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            await require('./scripts/component-release/release.cjs').publish({ github, context, core, dryRun: context.eventName === 'workflow_dispatch' && context.payload.inputs?.dry_run !== 'false' });
