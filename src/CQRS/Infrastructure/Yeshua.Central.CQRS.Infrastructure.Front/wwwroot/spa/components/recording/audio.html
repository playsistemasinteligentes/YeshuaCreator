<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recorder Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #1e2a3a;
            --bg2: #243142;
            --bg3: #2c3d52;
            --border: rgba(255,255,255,0.08);
            --border2: rgba(255,255,255,0.14);
            --text: #d4dde8;
            --text2: #8a9bb0;
            --text3: #5a6e84;
            --accent: #4da6ff;
            --accent2: #2d8aff;
            --green: #3ecf8e;
            --orange: #f0a057;
            --red: #f06a6a;
            --blue-pill: rgba(77,166,255,0.12);
            --green-pill: rgba(62,207,142,0.12);
            --orange-pill: rgba(240,160,87,0.12);
            --red-pill: rgba(240,106,106,0.12);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1.5rem;
            gap: 1.25rem;
        }

        /* Title */
        .title {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text3);
        }

        /* Timer */
        #timer {
            font-family: 'DM Mono', monospace;
            font-size: 56px;
            font-weight: 500;
            letter-spacing: -1px;
            color: var(--accent);
            line-height: 1;
            transition: color 0.3s;
        }

            #timer.paused {
                color: var(--orange);
            }

            #timer.done {
                color: var(--text3);
            }

        /* Status pill */
        #status {
            display: flex;
            align-items: center;
            gap: 7px;
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.13em;
            text-transform: uppercase;
            padding: 5px 14px;
            border-radius: 99px;
            border: 1px solid var(--border2);
            color: var(--text3);
            background: var(--bg2);
            transition: all 0.3s;
        }

            #status.recording {
                color: var(--green);
                background: var(--green-pill);
                border-color: rgba(62,207,142,0.3);
            }

            #status.paused {
                color: var(--orange);
                background: var(--orange-pill);
                border-color: rgba(240,160,87,0.3);
            }

            #status.uploading {
                color: var(--accent);
                background: var(--blue-pill);
                border-color: rgba(77,166,255,0.3);
            }

            #status.done {
                color: var(--text3);
                background: var(--bg2);
                border-color: var(--border);
            }

            #status.error {
                color: var(--red);
                background: var(--red-pill);
                border-color: rgba(240,106,106,0.3);
            }

        #dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
        }

            #dot.blink {
                animation: blink 1s infinite;
            }

        @keyframes blink {
            0%,100% {
                opacity: 1
            }

            50% {
                opacity: 0.2
            }
        }

        /* VU meter */
        .vu-wrap {
            width: 320px;
            height: 3px;
            background: var(--bg3);
            border-radius: 99px;
            overflow: hidden;
        }

        #vu-bar {
            height: 100%;
            width: 0;
            border-radius: 99px;
            background: var(--accent);
            transition: width 0.05s linear;
        }

        /* Buttons */
        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 9px 20px;
            border-radius: 8px;
            border: 1px solid var(--border2);
            background: var(--bg2);
            color: var(--text2);
            cursor: pointer;
            transition: all 0.15s;
        }

            .btn:hover:not(:disabled) {
                border-color: var(--accent);
                color: var(--accent);
                background: var(--blue-pill);
            }

            .btn:active:not(:disabled) {
                transform: scale(.97);
            }

            .btn:disabled {
                opacity: .3;
                cursor: not-allowed;
            }

            .btn.primary {
                border-color: var(--accent);
                color: var(--accent);
                background: var(--blue-pill);
            }

            .btn.danger:hover:not(:disabled) {
                border-color: var(--red);
                color: var(--red);
                background: var(--red-pill);
            }

        /* Stats grid */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 420px;
        }

        .stat-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 8px;
            text-align: center;
        }

            .stat-card .val {
                font-family: 'DM Mono', monospace;
                font-size: 22px;
                font-weight: 500;
                color: var(--text);
            }

            .stat-card .lbl {
                font-size: 10px;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: var(--text3);
                margin-top: 4px;
            }

        /* Health bars */
        .health {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .hrow {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
        }

        .hlabel {
            color: var(--text3);
            width: 90px;
            shrink: 0;
        }

        .htrack {
            flex: 1;
            height: 3px;
            background: var(--bg3);
            border-radius: 99px;
            overflow: hidden;
        }

        .hbar {
            height: 100%;
            border-radius: 99px;
            background: var(--accent);
            transition: width 0.5s ease, background 0.5s ease;
        }

        .hval {
            color: var(--text2);
            width: 52px;
            text-align: right;
            font-family: 'DM Mono', monospace;
            font-size: 10px;
        }

        /* Alerts */
        #alerts {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .alert {
            font-size: 12px;
            padding: 9px 12px;
            border-radius: 8px;
            border-left: 3px solid;
            animation: fadeIn 0.3s ease;
        }

            .alert.warn {
                border-color: var(--orange);
                background: var(--orange-pill);
                color: var(--orange);
            }

            .alert.err {
                border-color: var(--red);
                background: var(--red-pill);
                color: var(--red);
            }

            .alert.ok {
                border-color: var(--green);
                background: var(--green-pill);
                color: var(--green);
            }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        /* Toggle */
        .toggle-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            color: var(--text3);
        }

        .toggle {
            position: relative;
            width: 36px;
            height: 20px;
            border-radius: 99px;
            border: 1px solid var(--border2);
            background: var(--bg3);
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

            .toggle::after {
                content: '';
                position: absolute;
                width: 14px;
                height: 14px;
                border-radius: 50%;
                background: var(--text3);
                top: 2px;
                left: 2px;
                transition: transform 0.2s, background 0.2s;
            }

            .toggle.on {
                background: rgba(77,166,255,0.2);
                border-color: var(--accent);
            }

                .toggle.on::after {
                    transform: translateX(16px);
                    background: var(--accent);
                }

        /* Log */
        details {
            width: 100%;
            max-width: 420px;
        }

        summary {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text3);
            cursor: pointer;
            padding: 4px 0;
            user-select: none;
            transition: color 0.15s;
        }

            summary:hover {
                color: var(--text2);
            }

        #log {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            height: 160px;
            overflow-y: auto;
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--text3);
            line-height: 1.7;
            margin-top: 8px;
        }

            #log .ok {
                color: var(--green);
            }

            #log .err {
                color: var(--red);
            }

            #log .warn {
                color: var(--orange);
            }

            #log .info {
                color: var(--accent);
            }
    </style>
</head>

<body>
    <p class="title">Recorder Pro</p>

    <div id="timer">00:00:00</div>

    <div id="status">
        <div id="dot"></div>
        <span id="status-text">idle</span>
    </div>

    <div class="vu-wrap">
        <div id="vu-bar"></div>
    </div>

    <div class="controls">
        <button id="btnStart" onclick="Recorder.start()" class="btn primary">Start</button>
        <button id="btnPause" onclick="Recorder.pause()" class="btn" disabled>Pause</button>
        <button id="btnResume" onclick="Recorder.resume()" class="btn" disabled>Resume</button>
        <button id="btnStop" onclick="Recorder.stop()" class="btn danger" disabled>Finalizar</button>
    </div>

    <div class="stats">
        <div class="stat-card"><div class="val" id="st-chunks">0</div><div class="lbl">Chunks</div></div>
        <div class="stat-card"><div class="val" id="st-sent">0</div><div class="lbl">Enviados</div></div>
        <div class="stat-card"><div class="val" id="st-pending">0</div><div class="lbl">Pendentes</div></div>
        <div class="stat-card"><div class="val" id="st-errors">0</div><div class="lbl">Erros</div></div>
    </div>

    <div class="health">
        <div class="hrow">
            <span class="hlabel">DB usage</span>
            <div class="htrack"><div class="hbar" id="hb-db" style="width:0%"></div></div>
            <span class="hval" id="hv-db">0 / 200</span>
        </div>
        <div class="hrow">
            <span class="hlabel">Upload queue</span>
            <div class="htrack"><div class="hbar" id="hb-q" style="width:0%"></div></div>
            <span class="hval" id="hv-q">0</span>
        </div>
        <div class="hrow">
            <span class="hlabel">Backoff</span>
            <div class="htrack"><div class="hbar" id="hb-bo" style="width:0%"></div></div>
            <span class="hval" id="hv-bo">1s</span>
        </div>
    </div>

    <div id="alerts"></div>

    <div class="toggle-row">
        <div class="toggle on" id="uploadToggle" onclick="Recorder.toggleUpload()"></div>
        <span>Upload automático</span>
    </div>

    <details>
        <summary>&#9654; Log técnico</summary>
        <div id="log"></div>
    </details>

    <script type="module">
        import { SessionRecorder } from '/spa/scripts/components/recording/session-recorder.js?v=20261028-clinica04';
        const el = id => document.getElementById(id), params = new URLSearchParams(location.search);
        const token = () => localStorage.getItem('token') || '';
        const payload = token().split('.')[1];
        const identity = payload ? JSON.parse(atob(payload.replace(/-/g, '+').replace(/_/g, '/'))) : {};
        const actor = [identity.tenantId || identity.tenantID || identity.TenantID,
            identity.userId || identity.sub || identity.nameid || identity['http://schemas.xmlsoap.org/ws/2005/05/identity/claims/nameidentifier']].join(':');
        const sessionId = Number(params.get('sessaoId'));
        const normalize = value => value && typeof value === 'object' ? Object.fromEntries(Object.entries(value).map(([k,v]) => [k[0].toLowerCase()+k.slice(1),normalize(v)])) : value;
        async function post(path, body) {
            const response = await fetch('/apps/clinica/yapi'+path, { method:'POST', headers:{Authorization:'Bearer '+token(),...(body instanceof FormData?{}:{'Content-Type':'application/json'})}, body:body instanceof FormData?body:JSON.stringify(body) });
            const data = normalize(await response.json());
            if (!response.ok) throw new Error(data.message || 'Falha no envio do áudio.');
            return data.data ?? data;
        }
        let previousState = '', total = 0, sent = 0, audioCtx, analyser, meterFrame;
        function log(message) {
            const line=document.createElement('div');line.textContent=new Date().toLocaleTimeString()+' · '+message;el('log').append(line);
            while(el('log').childElementCount>200)el('log').firstElementChild.remove();
        }
        function startVU() {
            if(audioCtx||!recorder.stream)return;
            audioCtx=new AudioContext();analyser=audioCtx.createAnalyser();analyser.fftSize=256;
            audioCtx.createMediaStreamSource(recorder.stream).connect(analyser);
            const data=new Uint8Array(analyser.frequencyBinCount);
            const draw=()=>{if(!audioCtx)return;if(!document.hidden){analyser.getByteFrequencyData(data);el('vu-bar').style.width=(data.reduce((sum,x)=>sum+x,0)/data.length/255*100)+'%';}meterFrame=requestAnimationFrame(draw);};draw();
        }
        function stopVU(){cancelAnimationFrame(meterFrame);audioCtx?.close().catch(()=>{});audioCtx=null;el('vu-bar').style.width='0%';}
        const recorder = new SessionRecorder({ actor, sessionId,
            startSession:async()=>{
                if(!sessionId||actor===':')throw new Error('Abra o gravador com uma consulta e um usuário autenticado.');
                return (await post('/FileUpload/InfraStarSessionUploadUseCase',{entityType:'Sesoes',entityId:String(sessionId),finalidade:'relato',autorizado:false})).uploadToken;
            },
            sendChunk:async(uploadToken,blob,index,final)=>{
                const form=new FormData();form.append('token',uploadToken);form.append('chunkIndex',String(index));form.append('isFinalChunk',String(final));
                form.append('fileName',`audio_chunk_${index}.webm`);form.append('contentType','audio/webm');form.append('fileStream',blob,`audio_chunk_${index}.webm`);
                return post('/FileUpload/InfraSendFileUseCase2',form);
            },
            changed:s=>{
                if(s.state!=='completed'){total=s.total;sent=s.sent;}
                const pending=Math.max(0,total-sent),capturing=['recording','paused'].includes(s.state);
                el('timer').textContent=[Math.floor(s.elapsed/3600),Math.floor(s.elapsed%3600/60),s.elapsed%60].map(x=>String(x).padStart(2,'0')).join(':');
                el('timer').className=s.state;el('status').className=s.state;el('status-text').textContent=s.state;el('dot').className=s.state==='recording'?'blink':'';
                el('btnStart').disabled=recorder.active;el('btnStart').textContent=recorder.pending&&!recorder.active?'Reenviar':'Start';
                el('btnPause').disabled=s.state!=='recording';el('btnResume').disabled=s.state!=='paused';el('btnStop').disabled=!capturing;
                el('st-chunks').textContent=total;el('st-sent').textContent=s.state==='completed'?total:sent;el('st-pending').textContent=s.state==='completed'?0:pending;
                el('st-errors').textContent=s.error?'1':'0';el('alerts').textContent=s.error||'';
                for(const [bar,label,value,max] of [['hb-db','hv-db',pending,200],['hb-q','hv-q',pending,20],['hb-bo','hv-bo',s.backoff/1000,60]]){el(bar).style.width=Math.min(100,value/max*100)+'%';el(label).textContent=String(value);}
                if(previousState!==s.state){log(s.state);previousState=s.state;}
                if(s.state==='recording')startVU();if(['completed','error','stopping'].includes(s.state))stopVU();
            }
        });
        async function action(fn){try{await fn();}catch(e){el('alerts').textContent=e.message;log(e.message);}}
        window.Recorder={start:()=>action(()=>recorder.pending?recorder.recover(recorder.pending.id):recorder.start()),pause:()=>recorder.pause(),resume:()=>action(()=>recorder.resume()),stop:()=>action(()=>recorder.stop()),toggleUpload:()=>{el('uploadToggle').className=recorder.toggleUpload()?'toggle on':'toggle';}};
        window.addEventListener('beforeunload',e=>{if(recorder.active||recorder.pending){e.preventDefault();e.returnValue='';}});
        action(async()=>{const pending=await recorder.recoverable();if(pending.length){recorder.pending=pending[0];recorder.notify('error','Áudio pendente desta consulta. Clique em Reenviar.');}});
    </script>
</body>
</html>
