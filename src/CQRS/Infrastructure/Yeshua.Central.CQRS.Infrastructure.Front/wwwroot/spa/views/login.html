<main class="yeshua-auth-page" aria-labelledby="login-title">
    <header class="yeshua-auth-brand">
        <i class="fa-solid fa-play" aria-hidden="true"></i>
        <div><strong>Play Sistemas Inteligentes</strong><span>Central Yeshua</span></div>
    </header>
    <section id="login-screen" class="yeshua-auth-panel" aria-labelledby="login-title">
        <h1 id="login-title">Entrar</h1>
        <form id="login-form" class="yeshua-auth-form">
            <div class="yeshua-auth-fields">
                <div class="yeshua-auth-field">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="seu@email.com" />
                </div>
                <div class="yeshua-auth-field">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" />
                </div>
            </div>
            <button type="submit" id="btn-login" class="yeshua-button-primary yeshua-auth-submit">
                <i class="fa-solid fa-arrow-right-to-bracket" aria-hidden="true"></i> Entrar
            </button>
        </form>
        <nav class="yeshua-auth-links" aria-label="Op&#231;&#245;es de acesso">
            <a href="#forgot"><i class="fa-solid fa-key" aria-hidden="true"></i> Esqueci a senha</a>
            <a href="#register"><i class="fa-solid fa-user-plus" aria-hidden="true"></i> Criar conta</a>
        </nav>
    </section>
</main>
