<main class="yeshua-auth-page" aria-labelledby="forgot-title">
    <header class="yeshua-auth-brand">
        <i class="fa-solid fa-play" aria-hidden="true"></i>
        <div><strong>Play Sistemas Inteligentes</strong><span>Central Yeshua</span></div>
    </header>
    <section id="forgot-password" class="yeshua-auth-panel" aria-labelledby="forgot-title">
        <h1 id="forgot-title">Recuperar senha</h1>
        <form id="forgot-password-form" class="yeshua-auth-form" method="post">
            <div class="yeshua-auth-fields">
                <div class="yeshua-auth-field">
                    <label for="forgot-email">E-mail</label>
                    <input type="email" name="email" id="forgot-email" required autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="seu@email.com" />
                </div>
                <div class="yeshua-auth-field">
                    <label for="forgot-notification">Receber recupera&#231;&#227;o por</label>
                    <select name="typeNotification" id="forgot-notification" required>
                        <option value="1">E-mail</option>
                        <option value="2">SMS</option>
                        <option value="3">WhatsApp</option>
                    </select>
                </div>
            </div>
            <button type="submit" id="btn-recover-password" class="yeshua-button-primary yeshua-auth-submit">
                <i class="fa-solid fa-key" aria-hidden="true"></i> Recuperar senha
            </button>
        </form>
        <nav class="yeshua-auth-links" aria-label="Op&#231;&#245;es de acesso">
            <a href="#login"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Voltar ao login</a>
        </nav>
    </section>
</main>
