<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recorder Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { mono: ['JetBrains Mono', 'Courier New', 'monospace'] },
                    keyframes: {
                        blink: { '0%,100%': { opacity: 1 }, '50%': { opacity: 0.2 } },
                        fadeIn: { from: { opacity: 0, transform: 'translateY(4px)' }, to: { opacity: 1, transform: 'translateY(0)' } },
                    },
                    animation: {
                        blink: 'blink 1s infinite',
                        fadeIn: 'fadeIn 0.3s ease',
                    },
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap');

        /* Transições que Tailwind CDN não gera dinamicamente */
        #vu-bar {
            transition: width 0.05s linear;
        }

        .hbar {
            transition: width 0.5s ease, background-color 0.5s ease;
        }

        #status, #timer {
            transition: all 0.3s;
        }

        /* Toggle knob */
        .toggle::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #0a0a0a;
            top: 2px;
            left: 2px;
            transition: transform 0.2s;
        }

        .toggle.on::after {
            transform: translateX(16px);
        }

        /* Dot blink */
        .dot-blink {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%,100% {
                opacity: 1
            }

            50% {
                opacity: .2
            }
        }

        /* Alert fadein */
        .alert {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        /* Log color spans */
        #log .ok {
            color: #00e5a0
        }

        #log .err {
            color: #ff4d6d
        }

        #log .warn {
            color: #ffb347
        }

        #log .info {
            color: #7eb8ff
        }

        /* Buttons (hover+disabled combos são chatos de fazer só com Tailwind CDN) */
        .btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 10px 20px;
            border-radius: 6px;
            border: 1px solid #222;
            background: #111;
            color: #999;
            cursor: pointer;
            transition: all 0.15s;
        }

            .btn:hover:not(:disabled) {
                border-color: #00e5a0;
                color: #00e5a0;
                background: rgba(0,229,160,.12);
            }

            .btn:active:not(:disabled) {
                transform: scale(.97);
            }

            .btn:disabled {
                opacity: .25;
                cursor: not-allowed;
            }

            .btn.primary {
                border-color: #00e5a0;
                color: #00e5a0;
            }

            .btn.danger:hover:not(:disabled) {
                border-color: #ff4d6d;
                color: #ff4d6d;
                background: rgba(255,77,109,.1);
            }
    </style>
</head>

<body class="bg-[#0a0a0a] text-[#e8e8e8] min-h-screen flex flex-col items-center px-4 py-8 gap-5 font-mono">

    <!-- Title -->
    <h1 class="text-xs tracking-[.2em] uppercase text-[#555]">Recorder Pro</h1>

    <!-- Timer -->
    <div id="timer" class="text-7xl sm:text-5xl font-semibold tracking-tight text-[#00e5a0] leading-none">00:00:00</div>

    <!-- Status pill -->
    <div id="status" class="text-[11px] tracking-[.15em] uppercase px-3 py-1 rounded-full border border-[#222] text-[#555] flex items-center gap-2">
        <div id="dot" class="w-2 h-2 rounded-full bg-current"></div>
        <span id="status-text">idle</span>
    </div>

    <!-- VU meter -->
    <div class="w-80 h-1 bg-[#1a1a1a] rounded-full overflow-hidden">
        <div id="vu-bar" class="h-full w-0 rounded-full" style="background:linear-gradient(90deg,#00e5a0,#00ffcc)"></div>
    </div>

    <!-- Controls -->
    <div class="flex gap-2 flex-wrap justify-center">
        <button id="btnStart" onclick="Recorder.start()" class="btn primary">Start</button>
        <button id="btnPause" onclick="Recorder.pause()" class="btn" disabled>Pause</button>
        <button id="btnResume" onclick="Recorder.resume()" class="btn" disabled>Resume</button>
        <button id="btnStop" onclick="Recorder.stop()" class="btn danger" disabled>Finalizar</button>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-4 sm:grid-cols-2 gap-2 w-full max-w-lg">
        <div class="bg-[#111] border border-[#222] rounded-lg p-3 text-center">
            <div class="text-xl font-semibold" id="st-chunks">0</div>
            <div class="text-[10px] tracking-widest uppercase text-[#555] mt-1">Chunks</div>
        </div>
        <div class="bg-[#111] border border-[#222] rounded-lg p-3 text-center">
            <div class="text-xl font-semibold" id="st-sent">0</div>
            <div class="text-[10px] tracking-widest uppercase text-[#555] mt-1">Enviados</div>
        </div>
        <div class="bg-[#111] border border-[#222] rounded-lg p-3 text-center">
            <div class="text-xl font-semibold" id="st-pending">0</div>
            <div class="text-[10px] tracking-widest uppercase text-[#555] mt-1">Pendentes</div>
        </div>
        <div class="bg-[#111] border border-[#222] rounded-lg p-3 text-center">
            <div class="text-xl font-semibold" id="st-errors">0</div>
            <div class="text-[10px] tracking-widest uppercase text-[#555] mt-1">Erros</div>
        </div>
    </div>

    <!-- Health bars -->
    <div class="w-full max-w-lg flex flex-col gap-2">
        <div class="flex items-center gap-2 text-[11px]">
            <span class="text-[#555] w-28 shrink-0">DB usage</span>
            <div class="flex-1 h-[3px] bg-[#1a1a1a] rounded-full overflow-hidden">
                <div class="hbar h-full rounded-full bg-[#00e5a0]" id="hb-db" style="width:0%"></div>
            </div>
            <span class="text-[#999] w-14 text-right text-[10px] shrink-0" id="hv-db">0 / 200</span>
        </div>
        <div class="flex items-center gap-2 text-[11px]">
            <span class="text-[#555] w-28 shrink-0">Upload queue</span>
            <div class="flex-1 h-[3px] bg-[#1a1a1a] rounded-full overflow-hidden">
                <div class="hbar h-full rounded-full bg-[#00e5a0]" id="hb-q" style="width:0%"></div>
            </div>
            <span class="text-[#999] w-14 text-right text-[10px] shrink-0" id="hv-q">0</span>
        </div>
        <div class="flex items-center gap-2 text-[11px]">
            <span class="text-[#555] w-28 shrink-0">Backoff</span>
            <div class="flex-1 h-[3px] bg-[#1a1a1a] rounded-full overflow-hidden">
                <div class="hbar h-full rounded-full bg-[#00e5a0]" id="hb-bo" style="width:0%"></div>
            </div>
            <span class="text-[#999] w-14 text-right text-[10px] shrink-0" id="hv-bo">1s</span>
        </div>
    </div>

    <!-- Alerts -->
    <div id="alerts" class="w-full max-w-lg flex flex-col gap-1"></div>

    <!-- Upload toggle -->
    <div class="flex items-center gap-3 text-[11px] text-[#555]">
        <div class="toggle on relative w-9 h-5 rounded-full cursor-pointer border" id="uploadToggle"
             style="background:#00e5a0;border-color:#00e5a0"
             onclick="Recorder.toggleUpload()"></div>
        <span>Upload automático</span>
    </div>

    <!-- Log -->
    <details class="w-full max-w-lg">
        <summary class="text-[11px] tracking-widest uppercase text-[#555] cursor-pointer py-1 hover:text-[#999] select-none">Log técnico</summary>
        <div id="log" class="bg-[#111] border border-[#222] rounded-lg p-3 h-44 overflow-y-auto text-[11px] text-[#999] leading-relaxed mt-2"></div>
    </details>

    <script>
        // ════════════════════════════════════════════════════════════
        // RECORDER PRO v3
        // ════════════════════════════════════════════════════════════

        const CHUNK_MS = 10_000;
        const MAX_RETRIES = 5;
        const MAX_DB_CHUNKS = 200;
        const BACKOFF_BASE = 1_000;
        const BACKOFF_MAX = 60_000;
        const HEARTBEAT_MS = 15_000;

        function freshState() {
            return {
                sessionId: null, uploadToken: null, mediaRecorder: null, stream: null,
                audioCtx: null, analyser: null, chunkIndex: 0, isFinal: false,
                uploadEnabled: true, workerAbort: null, timerInterval: null,
                startTime: 0, pausedAt: 0, pausedTotal: 0,
                vuRunning: false, vuStopped: false,
                heartbeatTimer: null, lastChunkAt: 0,
                totalChunks: 0, sentChunks: 0, errorChunks: 0,
                backoffMs: BACKOFF_BASE, _userPaused: false, wakeLock: null,
            };
        }
        let app = freshState();
        let db = null;

        // ── Log ──────────────────────────────────────────────────────
        const logEl = document.getElementById('log');
        function log(msg, type = '') {
            const ts = new Date().toTimeString().slice(0, 8);
            logEl.innerHTML += `<span class="${type}">[${ts}] ${msg}</span>\n`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        // ── Alertas ──────────────────────────────────────────────────
        const alertsEl = document.getElementById('alerts');
        const activeAlerts = {};
        const alertStyles = {
            warn: 'border-l-4 border-[#ffb347] bg-[rgba(255,179,71,.07)] text-[#ffb347] text-[11px] px-3 py-2 rounded-md',
            err: 'border-l-4 border-[#ff4d6d] bg-[rgba(255,77,109,.07)] text-[#ff4d6d] text-[11px] px-3 py-2 rounded-md',
            ok: 'border-l-4 border-[#00e5a0] bg-[rgba(0,229,160,.12)] text-[#00e5a0] text-[11px] px-3 py-2 rounded-md',
        };
        function setAlert(key, msg, type = 'warn') {
            if (activeAlerts[key]) return;
            const el = document.createElement('div');
            el.className = 'alert ' + (alertStyles[type] || alertStyles.warn);
            el.textContent = msg;
            alertsEl.appendChild(el);
            activeAlerts[key] = el;
            if (type === 'ok') setTimeout(() => clearAlert(key), 4000);
        }
        function clearAlert(key) {
            if (activeAlerts[key]) { activeAlerts[key].remove(); delete activeAlerts[key]; }
        }

        // ── Utils ────────────────────────────────────────────────────
        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
        function getSupportedMimeType() {
            const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'];
            for (const t of types) if (MediaRecorder.isTypeSupported(t)) return t;
            return '';
        }
        function genSessionId() { return `s${Date.now()}_${Math.random().toString(36).slice(2, 6)}`; }

        // ── UI ───────────────────────────────────────────────────────
        function setStatus(state, label) {
            const el = document.getElementById('status');
            const dot = document.getElementById('dot');
            const base = 'text-[11px] tracking-[.15em] uppercase px-3 py-1 rounded-full border flex items-center gap-2';
            const map = {
                idle: 'border-[#222] text-[#555]',
                recording: 'border-[#00e5a0] text-[#00e5a0] bg-[rgba(0,229,160,.12)]',
                paused: 'border-[#ffb347] text-[#ffb347] bg-[rgba(255,179,71,.1)]',
                uploading: 'border-[#7eb8ff] text-[#7eb8ff] bg-[rgba(126,184,255,.1)]',
                done: 'border-[#555] text-[#555]',
                error: 'border-[#ff4d6d] text-[#ff4d6d] bg-[rgba(255,77,109,.1)]',
            };
            el.className = base + ' ' + (map[state] || map.idle);
            dot.className = 'w-2 h-2 rounded-full bg-current' + (state === 'recording' ? ' dot-blink' : '');
            document.getElementById('status-text').textContent = label;
        }

        function setUIState(state) {
            document.getElementById('btnStart').disabled = ['recording', 'paused', 'finalizing'].includes(state);
            document.getElementById('btnPause').disabled = state !== 'recording';
            document.getElementById('btnResume').disabled = state !== 'paused';
            document.getElementById('btnStop').disabled = !['recording', 'paused'].includes(state);

            const timer = document.getElementById('timer');
            const base = 'text-7xl sm:text-5xl font-semibold tracking-tight leading-none ';
            timer.className = base + (state === 'paused' ? 'text-[#ffb347]' : state === 'done' ? 'text-[#555]' : 'text-[#00e5a0]');

            const statusMap = {
                idle: 'idle', recording: 'recording', paused: 'paused',
                finalizing: 'uploading', done: 'done', error: 'error',
            };
            const labelMap = {
                idle: 'idle', recording: 'recording', paused: 'paused',
                finalizing: 'finalizando…', done: 'concluído', error: 'erro',
            };
            setStatus(statusMap[state] || 'idle', labelMap[state] || 'idle');
        }

        function updateStats() {
            document.getElementById('st-chunks').textContent = app.totalChunks;
            document.getElementById('st-sent').textContent = app.sentChunks;
            document.getElementById('st-pending').textContent = app.totalChunks - app.sentChunks - app.errorChunks;
            document.getElementById('st-errors').textContent = app.errorChunks;
            persistSession();
        }

        function updateHealth(pendingCount) {
            function setBar(barId, valId, pct, valText) {
                const bar = document.getElementById(barId);
                bar.style.width = Math.min(pct, 100) + '%';
                bar.style.backgroundColor = pct > 80 ? '#ff4d6d' : pct > 50 ? '#ffb347' : '#00e5a0';
                document.getElementById(valId).textContent = valText;
            }
            setBar('hb-db', 'hv-db', pendingCount / MAX_DB_CHUNKS * 100, `${pendingCount} / ${MAX_DB_CHUNKS}`);
            setBar('hb-q', 'hv-q', pendingCount / 20 * 100, pendingCount);
            setBar('hb-bo', 'hv-bo', app.backoffMs / BACKOFF_MAX * 100, (app.backoffMs / 1000).toFixed(0) + 's');
        }

        // ── Timer ────────────────────────────────────────────────────
        function startTimer() {
            app.startTime = Date.now(); app.pausedTotal = 0;
            app.timerInterval = setInterval(() => {
                const tot = Math.floor((Date.now() - app.startTime - app.pausedTotal) / 1000);
                const h = Math.floor(tot / 3600), m = Math.floor((tot % 3600) / 60), s = tot % 60;
                document.getElementById('timer').textContent =
                    String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            }, 500);
        }
        function pauseTimer() { app.pausedAt = Date.now(); }
        function resumeTimer() { app.pausedTotal += Date.now() - app.pausedAt; }
        function stopTimer() { clearInterval(app.timerInterval); }

        // ── Wake Lock ────────────────────────────────────────────────
        async function requestWakeLock() {
            try {
                app.wakeLock = await navigator.wakeLock?.request('screen');
                log('WakeLock ativo', 'ok');
                document.addEventListener('visibilitychange', async () => {
                    if (document.visibilityState === 'visible' && app.mediaRecorder?.state === 'recording') {
                        try { app.wakeLock = await navigator.wakeLock?.request('screen'); log('WakeLock re-adquirido', 'ok'); } catch { }
                    }
                });
            } catch { log('WakeLock não suportado', 'warn'); }
        }

        // ── VU meter ─────────────────────────────────────────────────
        function startVU(stream) {
            if (app.vuRunning) return;
            app.vuRunning = true; app.vuStopped = false;
            app.audioCtx = new AudioContext();
            const src = app.audioCtx.createMediaStreamSource(stream);
            app.analyser = app.audioCtx.createAnalyser();
            app.analyser.fftSize = 256;
            src.connect(app.analyser);
            const data = new Uint8Array(app.analyser.frequencyBinCount);
            app.audioCtx.addEventListener('statechange', () => {
                if (app.audioCtx.state === 'suspended' && app.mediaRecorder?.state === 'recording')
                    app.audioCtx.resume().then(() => log('AudioContext resumido', 'warn'));
            });
            function draw() {
                if (!app.vuRunning) return;
                if (document.hidden) { app.vuStopped = true; app.vuRunning = false; document.getElementById('vu-bar').style.width = '0%'; return; }
                app.analyser.getByteFrequencyData(data);
                let sum = 0; for (let i = 0; i < data.length; i++) sum += data[i];
                document.getElementById('vu-bar').style.width = (sum / data.length / 255 * 100) + '%';
                requestAnimationFrame(draw);
            }
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible' && app.vuStopped && app.mediaRecorder?.state === 'recording') {
                    app.vuRunning = true; app.vuStopped = false; draw(); log('VU meter reativado', 'info');
                }
            });
            draw();
        }
        function stopVU() {
            app.vuRunning = false;
            if (app.audioCtx) { app.audioCtx.close().catch(() => { }); app.audioCtx = null; }
            document.getElementById('vu-bar').style.width = '0%';
        }

        // ── IndexedDB ────────────────────────────────────────────────
        function initDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open('RecorderDB_v3', 1);
                req.onupgradeneeded = e => {
                    const store = e.target.result.createObjectStore('chunks', { keyPath: 'key' });
                    store.createIndex('sessionId', 'sessionId', { unique: false });
                };
                req.onsuccess = e => { db = e.target.result; resolve(); };
                req.onerror = () => reject(req.error);
            });
        }
        function txOp(mode, fn) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(['chunks'], mode);
                tx.onerror = () => reject(tx.error);
                fn(tx.objectStore('chunks'), resolve, reject);
            });
        }
        function saveChunk(blob, sessionId, index) {
            return txOp('readwrite', (store, resolve) => {
                store.put({ key: `${sessionId}_${index}`, sessionId, index, blob, status: 'pending', retries: 0 }).onsuccess = resolve;
            });
        }
        function getSessionChunks(sessionId) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(['chunks'], 'readonly');
                const req = tx.objectStore('chunks').index('sessionId').getAll(IDBKeyRange.only(sessionId));
                req.onsuccess = () => resolve(req.result.sort((a, b) => a.index - b.index));
                req.onerror = () => reject(req.error);
            });
        }
        function updateChunk(chunk) { return txOp('readwrite', (store, resolve) => { store.put(chunk).onsuccess = resolve; }); }
        function deleteChunk(key) { return txOp('readwrite', (store, resolve) => { store.delete(key).onsuccess = resolve; }); }
        async function countPendingChunks(sessionId) {
            const chunks = await getSessionChunks(sessionId);
            return chunks.filter(c => c.status === 'pending' || c.status === 'error').length;
        }

        // ── API ──────────────────────────────────────────────────────
        async function startUploadSession() {
            const token = localStorage.getItem('token');
            const res = await fetch('/yapi/FileUpload/InfraStarSessionUploadUseCase', {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: '{}',
            });
            if (!res.ok) throw new Error('Falha sessão: ' + res.status);
            return (await res.json()).uploadToken;
        }
        async function sendChunk(uploadToken, chunk, isFinalChunk) {
            const token = localStorage.getItem('token');
            const fd = new FormData();
            const fileName = `audio_chunk_${chunk.index}.webm`;
            fd.append('token', uploadToken);
            fd.append('chunkIndex', chunk.index.toString());
            fd.append('isFinalChunk', isFinalChunk.toString());
            fd.append('fileName', fileName);
            fd.append('contentType', chunk.blob.type || 'audio/webm');
            fd.append('fileStream', chunk.blob, fileName);
            const res = await fetch('/yapi/FileUpload/InfraSendFileUseCase2', {
                method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: fd,
            });
            return res.ok;
        }

        // ── Upload Worker ─────────────────────────────────────────────
        async function uploadWorker(sessionId, uploadToken, signal) {
            log(`Worker iniciado [${sessionId}]`, 'info');
            app.backoffMs = BACKOFF_BASE;
            while (!signal.aborted) {
                if (!app.uploadEnabled) { await sleep(2000); continue; }
                let chunks;
                try { chunks = await getSessionChunks(sessionId); }
                catch (e) { log('Erro IDB: ' + e.message, 'err'); await sleep(5000); continue; }
                const pending = chunks.filter(c => c.status === 'pending' || c.status === 'error');
                if (pending.length >= MAX_DB_CHUNKS) {
                    setAlert('backpressure', `⚠ Fila cheia (${pending.length} chunks). Gravação pausada.`, 'warn');
                    if (app.mediaRecorder?.state === 'recording') { app.mediaRecorder.pause(); setUIState('paused'); }
                } else {
                    clearAlert('backpressure');
                    if (app.mediaRecorder?.state === 'paused' && !app._userPaused) { app.mediaRecorder.resume(); setUIState('recording'); }
                }
                updateHealth(pending.length);
                updateStats();
                if (pending.length === 0 && app.isFinal) {
                    log('Todos os chunks enviados.', 'ok');
                    setAlert('done', '✓ Upload completo!', 'ok');
                    clearPersistedSession(); setUIState('done'); return;
                }
                let anySuccess = false;
                for (const chunk of pending) {
                    if (signal.aborted) return;
                    if (!app.uploadEnabled) break;
                    if (chunk.retries >= MAX_RETRIES) {
                        log(`Chunk ${chunk.index} descartado após ${MAX_RETRIES} tentativas`, 'warn');
                        app.errorChunks++;
                        setAlert('chunks_lost', `⚠ ${app.errorChunks} chunk(s) descartado(s)`, 'warn');
                        await deleteChunk(chunk.key); updateStats(); continue;
                    }
                    const fresh = await getSessionChunks(sessionId);
                    const stillPending = fresh.filter(c => c.status === 'pending' || c.status === 'error');
                    const maxIndex = Math.max(...fresh.map(c => c.index));
                    const isFinalChunk = app.isFinal && chunk.index === maxIndex && stillPending.length === 1 && stillPending[0].key === chunk.key;
                    chunk.retries++; chunk.status = 'uploading'; await updateChunk(chunk);
                    log(`↑ chunk ${chunk.index}${isFinalChunk ? ' [FINAL]' : ''} (tentativa ${chunk.retries})`, 'info');
                    let ok = false;
                    try { ok = await sendChunk(uploadToken, chunk, isFinalChunk); } catch (e) { log(`Exceção chunk ${chunk.index}: ${e.message}`, 'err'); }
                    if (ok) {
                        log(`✓ chunk ${chunk.index} enviado`, 'ok');
                        app.sentChunks++; app.backoffMs = BACKOFF_BASE;
                        await deleteChunk(chunk.key); anySuccess = true; updateStats();
                        if (isFinalChunk) {
                            log('Chunk final entregue.', 'ok'); setAlert('done', '✓ Upload completo!', 'ok');
                            clearPersistedSession(); setUIState('done'); stopVU(); stopTimer(); return;
                        }
                    } else {
                        log(`✗ chunk ${chunk.index} falhou`, 'err');
                        chunk.status = 'error'; await updateChunk(chunk); updateHealth(pending.length);
                    }
                }
                if (!anySuccess && pending.length > 0) {
                    app.backoffMs = Math.min(app.backoffMs * 2, BACKOFF_MAX);
                    updateHealth(pending.length); log(`Backoff ${app.backoffMs / 1000}s`, 'warn');
                } else { app.backoffMs = BACKOFF_BASE; }
                await sleep(anySuccess ? 500 : app.backoffMs);
            }
            log(`Worker abortado [${sessionId}]`, 'warn');
        }

        // ── Heartbeat ─────────────────────────────────────────────────
        function startHeartbeat() {
            app.lastChunkAt = Date.now();
            app.heartbeatTimer = setInterval(() => {
                if (app.mediaRecorder?.state !== 'recording') return;
                const silence = Date.now() - app.lastChunkAt;
                if (silence > HEARTBEAT_MS * 2) {
                    setAlert('stream_dead', `⚠ Nenhum áudio há ${Math.round(silence / 1000)}s. Microfone OK?`, 'warn');
                } else { clearAlert('stream_dead'); }
            }, HEARTBEAT_MS);
        }
        function stopHeartbeat() { clearInterval(app.heartbeatTimer); }

        // ── Visibility ────────────────────────────────────────────────
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && app.mediaRecorder?.state === 'recording') log('Tela inativa — gravação continua', 'warn');
            if (!document.hidden && app.mediaRecorder?.state === 'recording') {
                log('Tela ativa novamente', 'info');
                if (app.audioCtx?.state === 'suspended') app.audioCtx.resume().catch(() => { });
            }
        });

        // ── Recorder API ──────────────────────────────────────────────
        window.Recorder = {
            async start() {
                if (app.workerAbort) { app.workerAbort.abort(); log('Sessão anterior abortada', 'warn'); }
                stopTimer(); stopHeartbeat();
                const prevStream = app.stream; app = freshState(); app.stream = prevStream;
                try {
                    await initDB(); await requestWakeLock();
                    app.sessionId = genSessionId();
                    app.uploadToken = await startUploadSession();
                    clearPersistedSession(); persistSession();
                    log(`Sessão: ${app.sessionId}`, 'info');
                    if (!app.stream) app.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    startVU(app.stream);
                    const mimeType = getSupportedMimeType();
                    log('Codec: ' + mimeType, 'info');
                    app.mediaRecorder = new MediaRecorder(app.stream, { mimeType });
                    app.mediaRecorder.ondataavailable = async e => {
                        if (e.data && e.data.size > 0) {
                            const index = app.chunkIndex++; app.totalChunks++; app.lastChunkAt = Date.now();
                            const pc = await countPendingChunks(app.sessionId);
                            if (pc >= MAX_DB_CHUNKS) {
                                log(`DB cheio (${pc} pendentes) — aguardando...`, 'warn');
                                let waited = 0;
                                while (await countPendingChunks(app.sessionId) >= MAX_DB_CHUNKS && waited < 30000) { await sleep(1000); waited += 1000; }
                            }
                            try { await saveChunk(e.data, app.sessionId, index); log(`Chunk ${index} salvo (${(e.data.size / 1024).toFixed(1)}KB)`, ''); }
                            catch (err) { log(`Erro ao salvar chunk ${index}: ${err.message}`, 'err'); }
                            updateStats();
                        }
                    };
                    app.mediaRecorder.onerror = e => {
                        log('MediaRecorder error: ' + e.error?.message, 'err');
                        setAlert('recorder_err', '⚠ Erro no MediaRecorder', 'err');
                    };
                    app.isFinal = false;
                    app.mediaRecorder.start(CHUNK_MS);
                    const ac = new AbortController(); app.workerAbort = ac;
                    uploadWorker(app.sessionId, app.uploadToken, ac.signal);
                    setUIState('recording'); startTimer(); startHeartbeat(); clearAlert('done');
                    log('Gravando...', 'ok');
                } catch (e) {
                    log('Erro ao iniciar: ' + e.message, 'err');
                    setAlert('start_err', '✗ Falha ao iniciar: ' + e.message, 'err');
                    setUIState('error');
                }
            },
            pause() {
                if (app.mediaRecorder?.state !== 'recording') return;
                app._userPaused = true; app.mediaRecorder.pause(); pauseTimer(); setUIState('paused'); log('Pausado', 'warn');
            },
            resume() {
                if (app.mediaRecorder?.state !== 'paused') return;
                app._userPaused = false; app.mediaRecorder.resume(); resumeTimer(); setUIState('recording'); log('Resumido', 'ok');
            },
            stop() {
                if (!app.mediaRecorder || app.mediaRecorder.state === 'inactive') { log('Nenhuma gravação ativa', 'warn'); return; }
                app.isFinal = true; app._userPaused = false;
                app.mediaRecorder.stop(); stopHeartbeat(); stopTimer();
                setUIState('finalizing'); log('Finalizando — aguardando upload...', 'warn');
            },
            toggleUpload() {
                app.uploadEnabled = !app.uploadEnabled;
                const t = document.getElementById('uploadToggle');
                if (app.uploadEnabled) { t.style.background = '#00e5a0'; t.style.borderColor = '#00e5a0'; }
                else { t.style.background = '#1a1a1a'; t.style.borderColor = '#222'; }
                log('Upload: ' + (app.uploadEnabled ? 'ON' : 'OFF'), app.uploadEnabled ? 'ok' : 'warn');
                if (!app.uploadEnabled) setAlert('upload_off', '⚠ Upload desabilitado', 'warn');
                else clearAlert('upload_off');
            },
        };

        // ── Persistência ──────────────────────────────────────────────
        function persistSession() {
            if (!app.sessionId) return;
            localStorage.setItem('recorder_session', JSON.stringify({
                sessionId: app.sessionId, uploadToken: app.uploadToken,
                startTime: app.startTime, chunkIndex: app.chunkIndex,
                totalChunks: app.totalChunks, sentChunks: app.sentChunks,
            }));
        }
        function clearPersistedSession() { localStorage.removeItem('recorder_session'); }

        // ── Recuperação ao carregar ───────────────────────────────────
        async function recoverSessionOnLoad() {
            await initDB();
            const raw = localStorage.getItem('recorder_session');
            if (!raw) { setUIState('idle'); updateStats(); updateHealth(0); return; }
            let saved;
            try { saved = JSON.parse(raw); } catch { clearPersistedSession(); setUIState('idle'); return; }
            const chunks = await getSessionChunks(saved.sessionId);
            const pending = chunks.filter(c => c.status === 'pending' || c.status === 'error' || c.status === 'uploading');
            if (pending.length === 0) {
                clearPersistedSession(); log('Sessão anterior já completa.', 'ok');
                setUIState('idle'); updateStats(); updateHealth(0); return;
            }
            log(`Sessão interrompida: ${pending.length} chunk(s) pendentes`, 'warn');
            setAlert('recover', `↺ ${pending.length} chunk(s) não enviados. Retomando...`, 'warn');
            app.sessionId = saved.sessionId; app.uploadToken = saved.uploadToken;
            app.startTime = saved.startTime || Date.now(); app.chunkIndex = saved.chunkIndex || 0;
            app.totalChunks = saved.totalChunks || chunks.length; app.sentChunks = saved.sentChunks || 0;
            app.isFinal = true; app.uploadEnabled = true;
            for (const c of chunks.filter(c => c.status === 'uploading')) {
                c.status = 'error'; c.retries = Math.max(0, c.retries - 1); await updateChunk(c);
            }
            const ac = new AbortController(); app.workerAbort = ac;
            setUIState('finalizing'); updateStats(); updateHealth(pending.length);
            log(`Retomando sessão ${app.sessionId}`, 'info');
            uploadWorker(app.sessionId, app.uploadToken, ac.signal).then(clearPersistedSession);
        }

        recoverSessionOnLoad();
    </script>
</body>
</html>
