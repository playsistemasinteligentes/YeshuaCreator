<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Recorder Pro – Upload Profissional</title>

    <style>
        body {
            font-family: Arial;
            background: #111;
            color: #0f0;
            padding: 20px;
            text-align: center;
        }

        button {
            padding: 10px;
            margin: 5px;
            font-size: 14px;
        }

        #log {
            margin-top: 20px;
            background: black;
            color: #00ff88;
            padding: 10px;
            height: 220px;
            overflow: auto;
            text-align: left;
            font-family: monospace;
        }

        #recIndicator {
            width: 12px;
            height: 12px;
            background: #500;
            border-radius: 50%;
            display: inline-block;
            margin-left: 10px;
        }

        #timer {
            font-size: 18px;
            margin-top: 10px;
        }

        #vu {
            width: 300px;
            height: 10px;
            background: #222;
            margin: 10px auto;
            position: relative;
        }

        #vuBar {
            height: 10px;
            width: 0%;
            background: #0f0;
        }
    </style>
</head>

<body>

    <h2>🎙️ Recorder Pro – Upload Profissional</h2>

    <button onclick="Recorder.start()">▶️ Start</button>
    <button onclick="Recorder.pause()">⏸️ Pause</button>
    <button onclick="Recorder.stop()">⏹️ Finalizar</button>
    <button onclick="Recorder.state()">📊 State</button>

    <div id="timer">00:00</div>
    <div id="recIndicator"></div>
    <div id="vu"><div id="vuBar"></div></div>

    <br>

    <button onclick="Recorder.playAll()">🎧 Todos</button>
    <button onclick="Recorder.list()">📋 Listar</button>
    <button onclick="Recorder.downloadAll()">⬇️ Download</button>
    <button onclick="Recorder.clear()">🗑️ Limpar</button>
    <button onclick="Recorder.toggleUpload()">🔌 Upload ON/OFF</button>

    <div id="log"></div>

    <script>
        function log(msg) {
            const el = document.getElementById("log");
            el.innerHTML += msg + "<br>";
            el.scrollTop = el.scrollHeight;
            console.log(msg);
        }

        if (!window.AudioRecorderApp) {
            window.AudioRecorderApp = {
                mediaRecorder: null,
                stream: null,
                db: null,
                chunkIndex: 0,
                chunksRecorded: 0,
                wakeLock: null,
                timerInterval: null,
                startTime: null,
                audioContext: null,
                analyser: null,
                CHUNK_TIME: 5000,
                uploadToken: null,
                MAX_RETRIES: 3,
                uploadEnabled: true,
                isFinal: false,
                uploadWorkerRunning: false
            };
        }
        const app = window.AudioRecorderApp;

        function sleep(ms) {
            return new Promise(r => setTimeout(r, ms));
        }

        function getSupportedMimeType() {
            const types = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus", "audio/mp4"];
            for (const t of types) if (MediaRecorder.isTypeSupported(t)) return t;
            return "";
        }

        async function enableWakeLock() {
            try {
                app.wakeLock = await navigator.wakeLock.request("screen");
                log("WakeLock ativo");
            } catch {
                log("WakeLock não suportado");
            }
        }

        function startTimer() {
            app.startTime = Date.now();
            app.timerInterval = setInterval(() => {
                const s = Math.floor((Date.now() - app.startTime) / 1000);
                const m = Math.floor(s / 60), ss = s % 60;
                document.getElementById("timer").innerText =
                    String(m).padStart(2, "0") + ":" + String(ss).padStart(2, "0");
            }, 1000);
        }
        function stopTimer() { clearInterval(app.timerInterval); }

        function startVU() {
            app.audioContext = new AudioContext();
            const source = app.audioContext.createMediaStreamSource(app.stream);
            app.analyser = app.audioContext.createAnalyser();
            source.connect(app.analyser);
            const data = new Uint8Array(app.analyser.frequencyBinCount);

            function draw() {
                app.analyser.getByteFrequencyData(data);
                let sum = 0;
                for (let i = 0; i < data.length; i++) sum += data[i];
                let avg = sum / data.length;
                document.getElementById("vuBar").style.width = (avg / 255 * 100) + "%";
                requestAnimationFrame(draw);
            }
            draw();
        }

        function initDB() {
            return new Promise(resolve => {
                const req = indexedDB.open("RecorderDB", 1);
                req.onupgradeneeded = e => {
                    e.target.result.createObjectStore("chunks", { keyPath: "index" });
                };
                req.onsuccess = e => {
                    app.db = e.target.result;
                    resolve();
                };
            });
        }

        function saveChunkDB(blob, index) {
            return new Promise(resolve => {
                const tx = app.db.transaction(["chunks"], "readwrite");
                tx.objectStore("chunks").put({
                    index,
                    blob,
                    status: "pending",
                    retries: 0
                });
                tx.oncomplete = resolve;
            });
        }

        function getAllChunksOrdered() {
            return new Promise(resolve => {
                const tx = app.db.transaction(["chunks"], "readonly");
                const req = tx.objectStore("chunks").getAll();
                req.onsuccess = () =>
                    resolve(req.result.sort((a, b) => a.index - b.index));
            });
        }

        async function startSession() {
            if (app.uploadToken) return app.uploadToken;

            const token = localStorage.getItem("token");

            const res = await fetch("/yapi/FileUpload/InfraStarSessionUploadUseCase", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({})
            });

            const data = await res.json();
            app.uploadToken = data.uploadToken;
            log("Token sessão: " + app.uploadToken);
            return app.uploadToken;
        }

        async function uploadChunk(chunk, isFinal = false) {
            try {
                const token = localStorage.getItem("token");

                const fd = new FormData();
                const fileName = `audio_chunk_${chunk.index}.webm`;

                fd.append("token", app.uploadToken);
                fd.append("chunkIndex", chunk.index.toString());
                fd.append("isFinalChunk", isFinal.toString());
                fd.append("fileName", fileName);
                fd.append("contentType", chunk.blob.type || "audio/webm");
                fd.append("fileStream", chunk.blob, fileName);

                const res = await fetch("/yapi/FileUpload/InfraSendFileUseCase2", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    },
                    body: fd
                });

                return res.ok;
            } catch (e) {
                console.error(e);
                return false;
            }
        }

        async function uploadWorker() {

            if (app.uploadWorkerRunning) return;
            app.uploadWorkerRunning = true;

            log("🚀 Upload worker iniciado");

            while (true) {

                if (!app.uploadEnabled) {
                    await sleep(2000);
                    continue;
                }

                const chunks = await getAllChunksOrdered();

                if (chunks.length === 0 && app.isFinal) {
                    log("✅ Upload finalizado");
                    app.uploadWorkerRunning = false;
                    return;
                }

                for (let i = 0; i < chunks.length; i++) {

                    const chunk = chunks[i];

                    if (chunk.status !== "pending" && chunk.status !== "error") continue;

                    const isLast = (i === chunks.length - 1);
                    const isFinal = isLast && app.isFinal;

                    let ok = false;

                    while (chunk.retries < app.MAX_RETRIES && !ok && app.uploadEnabled) {

                        chunk.retries++;
                        chunk.status = "uploading";

                        const tx = app.db.transaction(["chunks"], "readwrite");
                        tx.objectStore("chunks").put(chunk);

                        log("⬆️ Enviando chunk " + chunk.index + " tentativa " + chunk.retries);

                        ok = await uploadChunk(chunk, isFinal);

                        if (ok) {

                            log("✅ Upload OK chunk " + chunk.index);

                            const tx2 = app.db.transaction(["chunks"], "readwrite");
                            tx2.objectStore("chunks").delete(chunk.index);

                            if (isFinal) {
                                log("🎯 Último chunk enviado");
                                app.uploadWorkerRunning = false;
                                return;
                            }

                        } else {
                            log("❌ Erro upload chunk " + chunk.index);
                        }
                    }
                }

                await sleep(1000);
            }
        }

        window.Recorder = {

            async start() {
                await initDB();
                await enableWakeLock();
                await startSession();

                if (!app.uploadWorkerRunning) uploadWorker();

                if (!app.stream) {
                    app.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    startVU();
                }

                const mimeType = getSupportedMimeType();
                log("MimeType: " + mimeType);

                app.isFinal = false;

                app.mediaRecorder = new MediaRecorder(app.stream, { mimeType });

                app.mediaRecorder.ondataavailable = async e => {
                    if (e.data.size > 0) {
                        const index = app.chunkIndex++;
                        await saveChunkDB(e.data, index);
                        app.chunksRecorded++;
                        log("Chunk " + index + " salvo");
                    }
                };

                app.mediaRecorder.start(app.CHUNK_TIME);

                app.chunkTimer = setInterval(() => {
                    if (app.mediaRecorder.state === "recording") {
                        app.mediaRecorder.requestData();
                    }
                }, app.CHUNK_TIME);

                document.getElementById("recIndicator").style.background = "red";
                startTimer();

                log("🎙️ Gravando...");
            },

            pause() {
                if (app.mediaRecorder?.state === "recording") {
                    app.mediaRecorder.pause();
                    log("⏸️ Pausado");
                }
            },

            stop() {
                if (app.mediaRecorder) {

                    app.isFinal = true;

                    app.mediaRecorder.stop();

                    clearInterval(app.chunkTimer);
                    stopTimer();

                    document.getElementById("recIndicator").style.background = "#500";

                    log("⏹️ Finalizando gravação...");
                }
            }

        };
    </script>

</body>
</html>
