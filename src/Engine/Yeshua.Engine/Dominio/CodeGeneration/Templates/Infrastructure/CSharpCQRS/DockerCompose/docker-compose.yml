name: {{COMPOSE_PROJECT_NAME}}

services:
  {{APPLICATION_SLUG}}-front:
    build:
      context: ../../..
      dockerfile: infra/{{APPLICATION_NAME}}/DockerCompose/front/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - yeshua-net

  {{APPLICATION_SLUG}}-api:
    build:
      context: ../../..
      dockerfile: infra/{{APPLICATION_NAME}}/DockerCompose/api/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:7214"
      ASPNETCORE_ENVIRONMENT: "Production"
      Redis__Host: redis
      JwtSettings__SecretKey: "${YESHUA_JWT_SECRET:?Configure credentials.json}"
      MYCONFIG__READCONECTIONSTRING: "${MYCONFIG__READCONECTIONSTRING:?Configure credentials.json}"
      MYCONFIG__WRITECONECTIONSTRING: "${MYCONFIG__WRITECONECTIONSTRING:?Configure credentials.json}"
    expose:
      - "7214"
    restart: unless-stopped
    networks:
      - yeshua-net

  {{APPLICATION_SLUG}}-worker:
    build:
      context: ../../..
      dockerfile: infra/{{APPLICATION_NAME}}/DockerCompose/worker/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:7215"
      ASPNETCORE_ENVIRONMENT: "Production"
      Redis__Host: redis
      MYCONFIG__READCONECTIONSTRING: "${MYCONFIG__READCONECTIONSTRING:?Configure credentials.json}"
      MYCONFIG__WRITECONECTIONSTRING: "${MYCONFIG__WRITECONECTIONSTRING:?Configure credentials.json}"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: "${YESHUA_RABBITMQ_USERNAME:?Configure credentials.json}"
      RabbitMq__Password: "${YESHUA_RABBITMQ_PASSWORD:?Configure credentials.json}"
      RabbitMq__VirtualHost: /
    expose:
      - "7215"
    restart: unless-stopped
    networks:
      - yeshua-net

  {{APPLICATION_SLUG}}-migration:
    build:
      context: ../../..
      dockerfile: infra/{{APPLICATION_NAME}}/DockerCompose/migration/Dockerfile
    environment:
      MYCONFIG__READCONECTIONSTRING: "${MYCONFIG__READCONECTIONSTRING:?Configure credentials.json}"
      MYCONFIG__WRITECONECTIONSTRING: "${MYCONFIG__WRITECONECTIONSTRING:?Configure credentials.json}"
      MYCONFIG__CENTRALAUTHORIZATIONCONECTIONSTRING: "${YESHUA_SQL_CENTRAL_AUTHORIZATION:?Configure credentials.json}"
    restart: "no"
    networks:
      - yeshua-net

networks:
  yeshua-net:
    external: true
    name: yeshua-net
