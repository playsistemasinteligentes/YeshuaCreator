<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Aplicação</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .container {
            display: flex;
            flex-grow: 1;
        }
        header {
            background: #333;
            color: white;
            text-align: center;
            padding: 0.3rem;
            font-size: 0.8rem;
        }
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 0.3rem;
            font-size: 0.8rem;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        .sidebar {
            width: 250px;
            background: #444;
            color: white;
            padding: 1rem;
            display: none;
        }
        .sidebar ul {
            list-style: none;
            padding: 0;
        }
        .sidebar ul li {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #555;
        }
        main {
            flex-grow: 1;
            padding: 2rem;
        }
        #login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #login-container input, button {
            margin: 5px;
            padding: 10px;
            width: 200px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Minha Aplicação</h1>
    </header>
    <div id="login-container">
        <h2>Login</h2>
        <form id="login-form">
            <input type="text" id="username" placeholder="Usuário" required>
            <input type="password" id="password" placeholder="Senha" required>
            <button type="submit">Entrar</button>
        </form>
    </div>
    <div class="container" id="app" style="display: none;">
        <aside class="sidebar" id="sidebar">
            <nav>
                <ul id="menu"></ul>
            </nav>
        </aside>
        <main>
            <div id="content">Bem-vindo!</div>
        </main>
    </div>
    <footer>
        <p>&copy; 2025 Minha Aplicação</p>
    </footer>
    <script>
        const API_BASE = "http://localhost:5162";

        document.getElementById('login-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            const response = await fetch(`${API_BASE}/Login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            
            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('token', data.token);
                document.getElementById('login-container').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                document.getElementById('sidebar').style.display = 'block';
                loadMenu();
            } else {
                alert('Login falhou!');
            }
        });

        async function loadMenu() {
            const token = localStorage.getItem('token');
            if (!token) return;
            
            const response = await fetch(`${API_BASE}/getMenu`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            if (response.ok) {
                const menuItems = await response.json();
                const menuList = document.getElementById('menu');
                menuList.innerHTML = '';
                
                menuItems.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = item.description;
                    li.addEventListener('click', () => loadPage(item.endpoint));
                    menuList.appendChild(li);
                });
            }
        }

        function loadPage(endpoint) {
            const content = document.getElementById('content');
            content.innerHTML = `<p>Carregando ${endpoint}...</p>`;
        }
    </script>
</body>
</html>
