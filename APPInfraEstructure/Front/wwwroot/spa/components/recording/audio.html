<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Recorder Pro Debug</title>

    <style>
        body {
            font-family: Arial;
            background: #111;
            color: #0f0;
            padding: 20px;
            text-align: center;
        }

        button {
            padding: 10px;
            margin: 5px;
            font-size: 14px;
        }

        #log {
            margin-top: 20px;
            background: black;
            color: #00ff88;
            padding: 10px;
            height: 220px;
            overflow: auto;
            text-align: left;
            font-family: monospace;
        }

        #recIndicator {
            width: 12px;
            height: 12px;
            background: #500;
            border-radius: 50%;
            display: inline-block;
            margin-left: 10px;
        }

        #timer {
            font-size: 18px;
            margin-top: 10px;
        }

        #vu {
            width: 300px;
            height: 10px;
            background: #222;
            margin: 10px auto;
            position: relative;
        }

        #vuBar {
            height: 10px;
            width: 0%;
            background: #0f0;
        }
    </style>
</head>
<body>

    <h2>🎙️ Recorder Pro – Debug</h2>

    <button onclick="Recorder.start()">▶️ Start</button>
    <button onclick="Recorder.pause()">⏸️ Pause</button>
    <button onclick="Recorder.resume()">⏯️ Resume</button>
    <button onclick="Recorder.stop()">⏹️ Stop</button>
    <button onclick="Recorder.state()">📊 State</button>

    <div id="timer">00:00</div>
    <div id="recIndicator"></div>

    <div id="vu"><div id="vuBar"></div></div>

    <br>

    <button onclick="Recorder.playLast()">▶️ Último</button>
    <button onclick="Recorder.playAll()">🎧 Todos</button>
    <button onclick="Recorder.list()">📋 Listar</button>
    <button onclick="Recorder.downloadAll()">⬇️ Download</button>
    <button onclick="Recorder.clear()">🗑️ Limpar</button>

    <div id="log"></div>

    <script>
        function log(msg) {
            const el = document.getElementById("log");
            el.innerHTML += msg + "<br>";
            el.scrollTop = el.scrollHeight;
            console.log(msg);
        }

        if (!window.AudioRecorderApp) {
            window.AudioRecorderApp = {
                mediaRecorder: null,
                stream: null,
                db: null,
                chunkIndex: 0,
                chunksRecorded: 0,
                wakeLock: null,
                timerInterval: null,
                startTime: null,
                audioContext: null,
                analyser: null,
                CHUNK_TIME: 5000
            };
        }
        const app = window.AudioRecorderApp;

        //////////////////// MIME ////////////////////
        function getSupportedMimeType() {
            const types = [
                "audio/webm;codecs=opus",
                "audio/webm",
                "audio/ogg;codecs=opus",
                "audio/mp4"
            ];
            for (const t of types) {
                if (MediaRecorder.isTypeSupported(t)) return t;
            }
            return "";
        }

        //////////////////// WAKE LOCK ////////////////////
        async function enableWakeLock() {
            try {
                app.wakeLock = await navigator.wakeLock.request("screen");
                log("WakeLock ativo");
            } catch (e) {
                log("WakeLock não suportado");
            }
        }

        //////////////////// TIMER ////////////////////
        function startTimer() {
            app.startTime = Date.now();
            app.timerInterval = setInterval(() => {
                const s = Math.floor((Date.now() - app.startTime) / 1000);
                const m = Math.floor(s / 60);
                const ss = s % 60;
                document.getElementById("timer").innerText =
                    String(m).padStart(2, "0") + ":" + String(ss).padStart(2, "0");
            }, 1000);
        }
        function stopTimer() {
            clearInterval(app.timerInterval);
        }

        //////////////////// VU METER ////////////////////
        function startVU() {
            app.audioContext = new AudioContext();
            const source = app.audioContext.createMediaStreamSource(app.stream);
            app.analyser = app.audioContext.createAnalyser();
            source.connect(app.analyser);

            const data = new Uint8Array(app.analyser.frequencyBinCount);

            function draw() {
                app.analyser.getByteFrequencyData(data);
                let sum = 0;
                for (let i = 0; i < data.length; i++) sum += data[i];
                let avg = sum / data.length;
                document.getElementById("vuBar").style.width = (avg / 255 * 100) + "%";
                requestAnimationFrame(draw);
            }
            draw();
        }

        //////////////////// DB ////////////////////
        function initDB() {
            return new Promise((resolve) => {
                const request = indexedDB.open("RecorderDB", 1);
                request.onupgradeneeded = e => {
                    e.target.result.createObjectStore("chunks", { keyPath: "index" });
                };
                request.onsuccess = e => {
                    app.db = e.target.result;
                    resolve();
                };
            });
        }

        function saveChunkDB(blob, index) {
            return new Promise((resolve) => {
                const tx = app.db.transaction(["chunks"], "readwrite");
                tx.objectStore("chunks").put({ index, blob });
                tx.oncomplete = resolve;
            });
        }

        function getAllChunksOrdered() {
            return new Promise((resolve) => {
                const tx = app.db.transaction(["chunks"], "readonly");
                const req = tx.objectStore("chunks").getAll();
                req.onsuccess = () => {
                    resolve(req.result.sort((a, b) => a.index - b.index));
                };
            });
        }

        //////////////////// RECORDER ////////////////////
        window.Recorder = {

            async start() {
                await initDB();
                await enableWakeLock();

                if (!app.stream) {
                    app.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    startVU();
                }

                const mimeType = getSupportedMimeType();
                log("MimeType: " + mimeType);

                app.mediaRecorder = new MediaRecorder(app.stream, { mimeType });

                app.mediaRecorder.ondataavailable = async (e) => {
                    log("ondataavailable");
                    if (e.data.size > 0) {
                        const index = app.chunkIndex++;
                        await saveChunkDB(e.data, index);
                        app.chunksRecorded++;
                        log("Chunk " + index + " salvo (" + (e.data.size / 1024).toFixed(1) + " KB)");
                    }
                };

                app.mediaRecorder.start(app.CHUNK_TIME);
                app.chunkTimer = setInterval(() => {
                    if (app.mediaRecorder.state === "recording") {
                        app.mediaRecorder.requestData();
                    }
                }, app.CHUNK_TIME);

                document.getElementById("recIndicator").style.background = "red";

                startTimer();
                log("Gravando...");
            },

            pause() {
                if (app.mediaRecorder?.state === "recording") {
                    app.mediaRecorder.pause();
                    log("Pausado");
                }
            },

            resume() {
                if (app.mediaRecorder?.state === "paused") {
                    app.mediaRecorder.resume();
                    log("Continuando...");
                }
            },

            stop() {
                if (app.mediaRecorder) {
                    app.mediaRecorder.stop();
                    clearInterval(app.chunkTimer);
                    stopTimer();
                    document.getElementById("recIndicator").style.background = "#500";
                    log("Finalizado");
                }
            },

            async state() {
                const chunks = await getAllChunksOrdered();
                log("Chunks: " + chunks.length);
                log("Index atual: " + app.chunkIndex);
            },

            //////////////////// DEBUG ////////////////////

            async playLast() {
                const chunks = await getAllChunksOrdered();
                if (!chunks.length) return log("Sem chunks");

                const last = chunks[chunks.length - 1];
                const url = URL.createObjectURL(last.blob);
                const audio = new Audio(url);
                audio.onended = () => URL.revokeObjectURL(url);
                audio.play();
            },

            async playAll() {
                const chunks = await getAllChunksOrdered();
                if (!chunks.length) return log("Sem chunks");

                // Junta todos os blobs em um só
                const blobs = chunks.map(c => c.blob);
                const mimeType = blobs[0].type;

                const combinedBlob = new Blob(blobs, { type: mimeType });
                const url = URL.createObjectURL(combinedBlob);

                const audio = new Audio(url);
                audio.onended = () => URL.revokeObjectURL(url);
                audio.play();

                log("Tocando áudio concatenado (" + chunks.length + " chunks)");
            },

            async list() {
                const chunks = await getAllChunksOrdered();
                chunks.forEach(c => {
                    log("Chunk " + c.index + " | " + (c.blob.size / 1024).toFixed(1) + " KB");
                });
            },

            async downloadAll() {
                const chunks = await getAllChunksOrdered();
                for (const c of chunks) {
                    const url = URL.createObjectURL(c.blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = "chunk_" + c.index + ".webm";
                    a.click();
                    URL.revokeObjectURL(url);
                }
            },

            async clear() {
                const tx = app.db.transaction(["chunks"], "readwrite");
                tx.objectStore("chunks").clear();
                app.chunkIndex = 0;
                log("DB limpo");
            }

        };
    </script>

</body>
</html>
