<div id="create-account" class="max-w-md mx-auto mt-16 p-6 bg-white shadow-lg rounded-lg">
    <h2 class="text-2xl font-semibold text-center mb-6 text-gray-800">Criar Conta</h2>

    <form id="create-account-form" class="space-y-4">
        <!-- CPF/CNPJ -->
        <input type="text"
               id="cpfCnpj"
               name="cpfCnpj"
               placeholder="CPF/CNPJ"
               inputmode="numeric"
               pattern="[0-9]*"
               required
               class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" />

        <!-- Nome -->
        <input type="text"
               id="nome"
               name="nome"
               placeholder="Nome"
               required
               class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" />

        <!-- Email -->
        <input type="email"
               id="email"
               name="email"
               placeholder="Digite seu e-mail"
               required
               class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" />

        <!-- Telefone -->
        <input type="tel"
               id="phone"
               name="phone"
               placeholder="Telefone"
               required
               class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" />

        <!-- Senha -->
        <input type="password"
               id="password"
               name="password"
               placeholder="Senha"
               required
               class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" />

        <!-- Confirmar Senha -->
        <input type="password"
               id="confirmpassword"
               name="confirmpassword"
               placeholder="Confirme a senha"
               required
               class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" />

        <!-- Botões -->
        <div class="flex items-center justify-center gap-6 pt-4">
            <button type="submit"
                    id="btn-create-account"
                    class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded font-medium transition">
                Criar Conta
            </button>

            <a href="#login" title="Voltar para login" class="text-blue-600 hover:text-blue-800">
                <i class="fas fa-sign-in-alt text-2xl"></i>
            </a>
        </div>
    </form>
</div>
