<div id="forgot-password" class="max-w-md mx-auto mt-20 p-6 bg-white shadow-lg rounded-lg">
    <h2 class="text-2xl font-semibold text-center mb-6 text-gray-800">Esqueci minha senha</h2>
    <form id="forgot-password-form" class="space-y-4" method="post">
        <input type="email"
               name="email"
               id="forgot-email"
               placeholder="Digite seu e-mail"
               required
               class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" />

        <select name="typeNotification"
                class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
                required>
            <option value="1">Email</option>
            <option value="2">SMS</option>
            <option value="3">Whatsapp</option>
        </select>

        <div class="flex items-center justify-center gap-6 pt-4">
            <button type="submit"
                    class="bg-yellow-500 hover:bg-yellow-600 text-white px-5 py-2 rounded font-medium transition">
                Recuperar Senha
            </button>

            <a href="#login" title="Voltar para login" class="text-blue-600 hover:text-blue-800">
                <i class="fas fa-sign-in-alt text-2xl"></i>
            </a>
        </div>
    </form>
</div>
