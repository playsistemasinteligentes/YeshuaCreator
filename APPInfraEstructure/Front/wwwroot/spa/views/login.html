<div id="login-screen" class="max-w-sm mx-auto mt-20 p-6 bg-white shadow-lg rounded-lg">
    <h2 class="text-2xl font-semibold text-center mb-6 text-gray-800">Login</h2>

    <form id="login-form" class="space-y-4">
        <input type="email"
               id="email"
               placeholder="Email"
               class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" />

        <input type="password"
               id="password"
               placeholder="Senha"
               class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" />

        <div class="flex items-center justify-center gap-6 pt-4">
            <button type="submit"
                    id="btn-login"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded font-medium transition">
                Entrar
            </button>

            <a href="#forgot" title="Esqueci a senha" class="text-blue-600 hover:text-blue-800">
                <i class="fas fa-key text-2xl"></i>
            </a>

            <a href="#register" title="Criar conta" class="text-green-600 hover:text-green-800">
                <i class="fas fa-user-plus text-2xl"></i>
            </a>
        </div>
    </form>
</div>
