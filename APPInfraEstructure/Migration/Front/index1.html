<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sistema de Cadastro</title>
	<link rel="stylesheet" href="styleTables.css">
	<link rel="stylesheet" href="menu.css">
	<style>
		body {
			font-family: Arial, sans-serif;
			background-color: #eef2f3;
			margin: 0;
			padding: 0;
		}

		.navbar {
			display: flex;
			justify-content: space-between;
			align-items: center;
			background-color: #0077b6;
			color: white;
			padding: 15px;
			font-size: 18px;
			position: relative;
		}

		.navbar h1 {
			margin: 0;
		}

		.menu {
			display: flex;
			flex-direction: column;
			align-items: flex-end;
		}

		.menu button {
			background: none;
			border: none;
			color: white;
			font-size: 24px;
			cursor: pointer;
		}

		.menu-content {
			display: none;
			position: absolute;
			background-color: white;
			box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
			min-width: 150px;
			border-radius: 5px;
			top: 50px;
			right: 10px;
		}

		.menu-content a {
			color: #0077b6;
			padding: 12px;
			display: block;
			text-decoration: none;
			transition: background 0.3s;
		}

		.menu-content a:hover {
			background-color: #caf0f8;
		}

		.menu.active .menu-content {
			display: block;
		}

		.container {
			width: 90%;
			max-width: 800px;
			margin: auto;
			background: white;
			padding: 20px;
			margin-top: 20px;
			box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
			border-radius: 8px;
			position: relative;
		}

		.buttons {
			display: flex;
			justify-content: space-between;
			flex-wrap: wrap;
		}

		.left-buttons,
		.right-buttons {
			display: flex;
			gap: 10px;
		}

		button {
			background: #00b4d8;
			color: white;
			border: none;
			padding: 10px 15px;
			cursor: pointer;
			border-radius: 5px;
			transition: background 0.3s;
		}

		button:hover {
			background: #0096c7;
		}

		.alert {
			background: rgba(0, 180, 216, 0.9);
			color: white;
			padding: 10px 15px;
			border-radius: 5px;
			position: absolute;
			top: -40px;
			right: 20px;
			display: none;
			transition: opacity 0.5s ease-in-out;
			font-size: 14px;
		}

		.alert.show {
			display: block;
			opacity: 1;
		}

		.form-group {
			display: flex;
			gap: 10px;
			flex-wrap: wrap;
		}

		.login-container {
			width: 300px;
			margin: 100px auto;
			background: white;
			padding: 20px;
			box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
			border-radius: 8px;
			text-align: center;
		}

		@media (max-width: 600px) {
			.navbar {
				flex-direction: column;
				align-items: flex-start;
			}

			.form-group {
				flex-direction: column;
				width: 100%;
			}

			.buttons {
				flex-direction: column;
				align-items: flex-start;
			}

			.right-buttons {
				margin-top: 10px;
			}

			.menu-content {
				top: 40px;
				right: 0;
				width: 100%;
			}
		}

		/* Tabela com rolagem horizontal */
		.table-container {
			width: 100%;
			max-height: 300px;
			overflow-y: auto;
			overflow-x: auto;
			-webkit-overflow-scrolling: touch;
			margin-top: 20px;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			min-width: 800px;
			/* Garantir que a tabela tenha largura mínima para rolar horizontalmente */
		}

		th,
		td {
			text-align: left;
			padding: 8px;
			border: 1px solid #ddd;
		}

		th {
			background-color: #0077b6;
			color: white;
		}

		tr:nth-child(even) {
			background-color: #f2f2f2;
		}

		td {
			word-wrap: break-word;
		}
	</style>
</head>

<body>
	<div id="login-screen" class="login-container">
		<h2>Login</h2>
		<form id="login-form">
			<input type="text" id="username" placeholder="Usuário" /><br><br>
			<input type="password" id="password" placeholder="Senha" /><br><br>
			<button type="submit">Entrar</button>
		</form>
	</div>

	<div id="app" style="display:none;">
		<div class="navbar">
			<h1>Sistema de Cadastro</h1>
			<div class="menu">
				<button onclick="toggleMenu()">☰</button>
				<div class="menu-content" id="menu">
					<a href="#" onclick="logout()">Logout</a>
				</div>
			</div>
		</div>

		<div id="crud-form" class="container" style="display:none;">
			<div class="alert" id="alert-msg">Registro salvo com sucesso!</div>
			<div class="buttons" id="crud-form-buttons">

			</div>
			<div class="buttons">
				<div class="left-buttons">
					<button id="btn-new" onclick="crudNew()">Novo Registro</button>
					<button id="btn-search-parameters" onclick="crudSearchParameters()">Pesquisar</button>
				</div>
				<div class="right-buttons">
					<button id="btn-create" style="display:none;" onclick="crudCreate()">Salvar</button>
					<button id="btn-update" style="display:none;" onclick="crudUpdate()">Atualizar</button>
					<button id="btn-search" style="display:none;" onclick="crudSearch()">Buscar</button>
				</div>
			</div>
			<h2 id="form-description"></h2>

			<div class="form-group" id="form-group">

			</div>

			<div id="table-container" class="table-container" style="display:none;">

			</div>
		</div>
	</div>

	<script>

		// start aplicatio e login 

		const API_BASE = "http://localhost:5162";

		document.addEventListener('DOMContentLoaded', async () => {
			const token = localStorage.getItem('token');
			if (token) {
				try {
					await loadMenu();
					document.getElementById("login-screen").style.display = "none";
					document.getElementById("app").style.display = "block";
				} catch (error) {
					localStorage.removeItem('token'); // Remove token inválido
					document.getElementById('login-screen').style.display = 'block';
					document.getElementById('app').style.display = 'none';
				}
			}
		});

		document.getElementById('login-form').addEventListener('submit', async (event) => {
			event.preventDefault();
			const username = document.getElementById('username').value;
			const password = document.getElementById('password').value;

			try {
				const response = await fetch(`${API_BASE}/Login`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ username, password })
				});


				if (response.ok) {
					const data = await response.json();
					localStorage.setItem('token', data.token);
					document.getElementById("login-screen").style.display = "none";
					document.getElementById("app").style.display = "block";
					loadMenu();
				} else {
					alert('Login falhou!');
				}
			} catch (error) {
				erroRequestResponse(error);
			}
		});



		// fim start apliction e login 




		async function loadMenu() {
			const token = localStorage.getItem('token');
			if (!token) throw new Error("Token não encontrado");

			try {

				const response = await fetch(`${API_BASE}/getMenu`, {
					headers: { 'Authorization': `Bearer ${token}` }
				});

				if (!response.ok) throw new Error("Token inválido ou expirado");

				const menuItems = await response.json();
				const menuList = document.getElementById('menu');
				menuList.innerHTML = '';

				menuItems.forEach(item => {
					const a = document.createElement('a'); // Criando o elemento <a>

					a.textContent = item.description; // Define o texto do link
					a.href = "#"; // Define um link "falso" para evitar navegação padrão
					a.addEventListener('click', (e) => {
						e.preventDefault(); // Evita que a página recarregue ao clicar
						loadCrud(`${API_BASE}${item.endpoint}`, item.type);
					});
					menuList.appendChild(a); // Adiciona <li> ao menu
				});
			} catch (error) {
				erroRequestResponse(error);
			}
		}


















		// crud 
		var _metadata = null;
		var _fullUrl = "";

		async function loadCrud(fullUrl, type) {
			const crudForm = document.getElementById('crud-form');
			document.getElementById('crud-form').style.display = 'none';
			document.getElementById('crud-form').style.display = 'block';
			const token = localStorage.getItem('token');
			try {

				const response = await fetch(fullUrl, {
					headers: { 'Authorization': `Bearer ${token}` }
				});


				if (response.ok) {
					_metadata = await response.json();
					_fullUrl = fullUrl;
					crudSearchParameters();
				} else {
					crudForm.innerHTML = `<p>Erro ao carregar os dados.</p>`;
				}
			} catch (error) {
				erroRequestResponse(error);
			}
		}


		function erroRequestResponse(erro) {

			logout();
		}




		function renderSearch(metadata) {

			const formGroup = document.getElementById('form-group');
			formGroup.innerHTML = '';


			// Seção de Pesquisa
			const searchSection = document.createElement('div');
			searchSection.classList.add('form-section'); // Adicionando classe CSS
			searchSection.innerHTML = `<h3>Pesquisar</h3>`;

			const searchFieldsContainer = document.createElement('div');
			searchFieldsContainer.classList.add('input-container'); // Container flexível

			metadata.searchFields.forEach(field => {
				const inputGroup = document.createElement('div');
				inputGroup.classList.add('input-group');

				const input = document.createElement('input');
				input.placeholder = field.label;  // O placeholder servirá de "guia" ao invés do label
				input.id = `search-${field.id}`;
				input.classList.add('styled-input');

				switch (field.type.toLowerCase()) {
					case "int":
						input.type = "number";
						input.step = "1";
						break;
					case "varchar":
					case "string":
						input.type = "text";
						break;
					case "datetime":
						input.type = "datetime-local";
						break;
					case "float":
					case "decimal":
						input.type = "number";
						input.step = "0.01";
						break;
					default:
						input.type = "text";
				}

				inputGroup.appendChild(input);  // ✅ Apenas adicionamos o input, sem label
				searchFieldsContainer.appendChild(inputGroup);

			});

			searchSection.appendChild(searchFieldsContainer);
			formGroup.appendChild(searchSection);

		}





		function renderFormCrud(metadata) {

			const formGroup = document.getElementById('form-group');
			formGroup.innerHTML = '';

			// Seção de Inserção
			const insertSection = document.createElement('div');
			insertSection.classList.add('form-section');
			insertSection.innerHTML = `<h3>Inserir Novo Registro</h3>`;
			insertSection.id = "insert-section";

			const insertFieldsContainer = document.createElement('div');
			insertFieldsContainer.classList.add('input-container');

			metadata.formFields.forEach(field => {
				const inputGroup = document.createElement('div');
				inputGroup.classList.add('input-group');

				const label = document.createElement('label');
				label.textContent = field.label;
				label.setAttribute('for', `insert-${field.id}`);

				const input = document.createElement('input');
				input.placeholder = field.label;
				input.id = `insert-${field.id}`;
				input.classList.add('styled-input');

				// Adicionando a lógica do switch para o tipo de input
				switch (field.type.toLowerCase()) {
					case "int":
						input.type = "number";
						input.step = "1";
						break;
					case "varchar":
					case "string":
						input.type = "text";
						break;
					case "datetime":
						input.type = "datetime-local";
						break;
					case "float":
					case "decimal":
						input.type = "number";
						input.step = "0.01";
						break;
					default:
						input.type = "text";
				}

				inputGroup.appendChild(label);
				inputGroup.appendChild(input);
				insertFieldsContainer.appendChild(inputGroup);
			});

			insertSection.appendChild(insertFieldsContainer);
			formGroup.appendChild(insertSection);
		}


		async function fetchSearchResults(endpoint, metadata) {
			const token = localStorage.getItem('token');

			// Criando um objeto com os filtros preenchidos
			const searchFilters = {};
			metadata.formFields.forEach(field => {
				var val = document.getElementById(`search-${field.id}`).value;
				if (val != "")
					searchFilters[field.id] = val;
			});


			try {

				const response = await fetch(`${API_BASE}${endpoint}`, {
					method: 'POST', // Mudamos de GET para POST
					headers: {
						'Authorization': `Bearer ${token}`,
						'Content-Type': 'application/json'
					},
					body: JSON.stringify(searchFilters) // Enviamos os filtros como JSON
				});


				if (response.ok) {
					const data = await response.json();
					renderTable(data, metadata);
				} else {
					alert('Erro ao buscar os dados.');
				}
			} catch (error) {
				erroRequestResponse(error);
			}
		}


		function renderTable(data, metadata) {

			const tablecontainer = document.getElementById('table-container');
			tablecontainer.innerHTML = '';

			const table = document.createElement('table');
			const header = document.createElement('thead');
			const headerRow = document.createElement('tr');

			metadata.formFields.forEach(field => {
				const th = document.createElement('th');
				th.textContent = field.label;
				headerRow.appendChild(th);
			});

			const thActions = document.createElement('th');
			thActions.textContent = 'Ações';
			headerRow.appendChild(thActions);
			header.appendChild(headerRow);
			table.appendChild(header);

			const tbody = document.createElement('tbody');
			table.appendChild(tbody);

			if (data.length === 0) {
				const row = document.createElement('tr');
				const cell = document.createElement('td');
				cell.colSpan = metadata.formFields.length + 1;
				cell.textContent = "Nenhum dado encontrado";
				row.appendChild(cell);
				tbody.appendChild(row);
			} else {
				data.forEach(item => {
					const row = document.createElement('tr');

					metadata.formFields.forEach(field => {
						const cell = document.createElement('td');
						cell.textContent = item[field.id.toLowerCase()] || '';
						row.appendChild(cell);
					});

					const actionsCell = document.createElement('td');

					// Link de Edição
					const editLink = document.createElement('a');
					editLink.href = "#";
					editLink.textContent = "Editar";
					editLink.addEventListener('click', () => editRecord(item, metadata));
					actionsCell.appendChild(editLink);

					actionsCell.appendChild(document.createTextNode(" | "));

					// Link de Exclusão
					const deleteLink = document.createElement('a');
					deleteLink.href = "#";
					deleteLink.textContent = "Excluir";
					deleteLink.addEventListener('click', () => deleteRecord(item, metadata));
					actionsCell.appendChild(deleteLink);

					row.appendChild(actionsCell);
					tbody.appendChild(row);
				});
			}

			tablecontainer.appendChild(table);
			document.getElementById('table-container').style.display = 'block';

		}


		// fim crud




















		function logout() {
			document.getElementById("app").style.display = "none";
			document.getElementById("login-screen").style.display = "block";
		}

		function toggleMenu() {
			let menu = document.getElementById("menu");
			menu.style.display = (menu.style.display === "block") ? "none" : "block";
		}















		function msg(msg) {
			alert(msg);
		}


		function showForm(form) {
			document.getElementById('dashboard-form').style.display = 'none';
			document.getElementById('configuracoes-form').style.display = 'none';
			if (form === 'dashboard') {
				document.getElementById('dashboard-form').style.display = 'block';
			} else if (form === 'configuracoes') {
				document.getElementById('configuracoes-form').style.display = 'block';
			}
		}

		function crudNew() {
			actionButtons(Actions.NEW);
			renderFormCrud(_metadata);
		}

		function crudSearchParameters() {
			actionButtons(Actions.SEARCH_PARAMETERS);
			renderSearch(_metadata);
		}

		function crudSearch() {
			fetchSearchResults(_metadata.endpoints.read, _metadata);
			actionButtons(Actions.SEARCH_PARAMETERS);
		}

		async function crudCreate() {
			//async function insertNewRecord(endpoint, metadata) {

			const token = localStorage.getItem('token');
			const newRecord = {};
			_metadata.formFields.forEach(field => {
				var val = document.getElementById(`insert-${field.id}`).value;
				if (val != "")
					newRecord[field.id] = val;
			});


			try {

				const response = await fetch(`${API_BASE}${_metadata.endpoints.create}`, {
					method: 'POST',
					headers: {
						'Authorization': `Bearer ${token}`,
						'Content-Type': 'application/json',
					},
					body: JSON.stringify(newRecord)
				});


				if (response.ok) {
					msg('Registro inserido com sucesso!');
				} else {
					msg('Erro ao inserir o registro.');
				}

				actionButtons(Actions.CREATE);
			} catch (error) {
				erroRequestResponse(error);
			}
		}
		async function crudUpdate() {

			const token = localStorage.getItem('token');
			const updatedRecord = {};
			_metadata.formFields.forEach(field => {
				updatedRecord[field.id] = document.getElementById(`insert-${field.id}`).value;
			});


			try {

				const response = await fetch(`${API_BASE}${_metadata.endpoints.update}`, {
					method: 'PUT',
					headers: {
						'Authorization': `Bearer ${token}`,
						'Content-Type': 'application/json',
					},
					body: JSON.stringify(updatedRecord)
				});

				if (response.ok) {
					msg('Registro atualizado com sucesso!');
				} else {
					msg('Erro ao atualizar o registro.');
				}

				actionButtons(Actions.UPDATE);

			} catch (error) {
				erroRequestResponse(error);
			}
		}
		async function crudDelete() {
			actionButtons(Actions.DELETE);
		}

		async function mostrarTabela() {
			document.getElementById("tabela-container").style.display = "block";
		}

		async function editRecord(item, metadata) {
			actionButtons(Actions.EDIT);

			renderFormCrud(metadata);

			// Preencher os campos de inserção com os dados do item
			metadata.formFields.forEach(field => {
				document.getElementById(`insert-${field.id}`).value = item[field.id.toLowerCase()] || '';
			});

			// Esconder o botão de "Inserir" e mostrar o botão de "Atualizar"
			const insertButton = document.querySelector('#insert-section button');
			insertButton.style.display = "none";  // Esconde o botão de Inserir



			// Mostrar o botão de atualização
			const updateButton = document.querySelector('#insert-section .update-button');
			updateButton.style.display = "inline-block"; // Exibe o botão de atualização
		}

		async function deleteRecord(item, metadata) {
			const token = localStorage.getItem('token');
			const deleteEndpoint = `${API_BASE}${metadata.endpoints.delete.replace("{entidade.EntityName}", metadata.entityName)}`;

			if (!confirm(`Tem certeza que deseja excluir o registro com ID ${item.id}?`)) return;


			try {

				const response = await fetch(deleteEndpoint, {
					method: 'DELETE',
					headers: {
						'Authorization': `Bearer ${token}`,
						'Content-Type': 'application/json',
					},
					body: JSON.stringify({ id: item.id }),
				});


				if (response.ok) {
					msg('Registro excluído com sucesso!');
				} else {
					msg('Erro ao excluir o registro.');
				}
			} catch (error) {
				erroRequestResponse(error);
			}
		}


		function actionButtons(action) {

			const formGroup = document.getElementById('form-group');
			formGroup.innerHTML = '';

			switch (action) {
				case Actions.NEW:
					document.getElementById("btn-create").style.display = "inline-block";
					document.getElementById("btn-update").style.display = "none";
					document.getElementById("btn-search").style.display = "none";

					//document.getElementById("alert-msg").classList.add("show");

					//setTimeout(() => {
					//    document.getElementById("alert-msg").classList.remove("show");
					//}, 3000);

					//document.getElementById("tabela-container").style.display = "block";
					break;
				case Actions.SEARCH_PARAMETERS:

					document.getElementById("btn-create").style.display = "none";
					document.getElementById("btn-update").style.display = "none";
					document.getElementById("btn-search").style.display = "inline-block";

					break;
				case Actions.EDIT:

					document.getElementById("btn-create").style.display = "none";
					document.getElementById("btn-update").style.display = "inline-block";
					document.getElementById("btn-search").style.display = "none";

					break;
				case Actions.SEARCH:
					console.log("Realizando a busca...");
					break;
				case Actions.CREATE:
					console.log("Criando um novo registro...");
					break;
				case Actions.UPDATE:
					console.log("Atualizando o registro...");
					break;
				case Actions.DELETE:
					console.log("Excluindo o registro...");
					break;
				default:
					document.getElementById("btn-create").style.display = "none";
					document.getElementById("btn-update").style.display = "none";
					document.getElementById("btn-search").style.display = "none";

			}

		}












	</script>
	<script src="enumerators.js"></script>
</body>

</html>
